name: Prepare module job
description: Checkout and prepare one Release build, reusing validated CI outputs on Windows and macOS.
inputs:
  registry-pull-username:
    description: Dedicated pull-only registry username for enabled Linux setup.
    default: ''
  registry-pull-password:
    description: Dedicated pull-only registry password for enabled Linux setup.
    default: ''
  solution:
    description: Validated workspace-relative solution output from shared CI, or none (Windows/macOS).
    default: ''
  submodules:
    description: Validated JSON array output of direct submodule paths from shared CI (Windows/macOS).
    default: '[]'
  global-json:
    description: Validated workspace-relative SDK path from shared CI (Windows/macOS).
    default: global.json
  module-manifest:
    description: Validated workspace-relative producer manifest, empty when disabled.
    default: ''
  windows-checkout:
    description: Validated immutable archive checkout JSON from shared CI.
    default: 'null'
  source-revision:
    description: Exact validated source commit required for protected Windows checkout.
    default: ''
  module-authority:
    description: Validated accepted-delivery authority from the successful shared CI job.
    default: ''
  module-root:
    description: Test-only module fixture root in the Builds repository (Linux only).
    default: ''
  environment:
    description: Linux environment mode, setup or preserve. Preserve builds once and retains private-runner fixture runtimes.
    default: setup
  authority-sha256:
    description: Exact owner request digest, required for preserve-mode qualification.
    default: ''
  source-sha:
    description: Green CI source commit, required for preserve-mode qualification.
    default: ''
  job-name:
    description: Enabled custom job whose validated setup overrides apply on Linux.
    default: ''
  resource-profile:
    description: Trusted execution profile selected by the generated caller.
    default: ''
  additional-sdk-version:
    description: Exact additional SDK supplying targeting packs for product compatibility fixtures.
    default: ''
  additional-test-projects:
    description: Validated workspace-relative JSON test projects built outside the platform solution.
    default: '[]'
runs:
  using: composite
  steps:
    - name: Prepare bounded mutation container prerequisites
      if: runner.os == 'Linux' && inputs.resource-profile == 'mutation'
      shell: bash
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends python3 patch
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.swap.max /sys/fs/cgroup/cpu.max

    - name: Install the supported mutation preparation interpreter
      if: runner.os == 'Linux' && inputs.resource-profile == 'mutation'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
      with:
        python-version: '3.12'

    - name: Enable long Git paths on disposable Windows runners
      if: runner.os == 'Windows' && runner.environment == 'github-hosted'
      shell: pwsh
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
      run: |
        git config --global core.longpaths true
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $configured = git config --global --type=bool --get core.longpaths
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ($configured -ne 'true') { throw 'Windows checkout requires core.longpaths=true.' }

    - name: Validate private qualification request
      if: inputs.environment == 'preserve'
      shell: bash
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        CI_PREPARE_ENVIRONMENT: ${{ inputs.environment }}
        CI_AUTHORITY_SHA256: ${{ inputs.authority-sha256 }}
        CI_SOURCE_SHA: ${{ inputs.source-sha }}
      run: python3 -I "$GITHUB_ACTION_PATH/prepare_linux.py" --phase request

    - name: Checkout module
      if: runner.os != 'Windows' || inputs.windows-checkout == '' || inputs.windows-checkout == 'null'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
      with:
        submodules: false
        persist-credentials: false

    - name: Protected Windows checkout and direct dependencies
      if: runner.os == 'Windows' && inputs.windows-checkout != '' && inputs.windows-checkout != 'null'
      shell: pwsh
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        GITHUB_TOKEN: ${{ github.token }}
        CI_PREPARE_SOLUTION: ${{ inputs.solution }}
        CI_PREPARE_GLOBAL_JSON: ${{ inputs.global-json }}
        CI_PREPARE_MODULE_MANIFEST: ${{ inputs.module-manifest }}
        CI_PREPARE_WINDOWS_CHECKOUT: ${{ inputs.windows-checkout }}
        CI_PREPARE_REVISION: ${{ inputs.source-revision }}
        CI_PREPARE_SUBMODULES_JSON: ${{ inputs.submodules }}
      run: |
        & python -I "$env:GITHUB_ACTION_PATH/prepare_windows_checkout.py"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Validate Linux configuration and direct dependencies
      id: linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        CI_REPOSITORY: ${{ github.repository }}
        CI_MODULE_ROOT: ${{ inputs.module-root }}
        CI_PREPARE_ENVIRONMENT: ${{ inputs.environment }}
        CI_CUSTOM_JOB: ${{ inputs.job-name }}
      run: python3 -I "$GITHUB_ACTION_PATH/prepare_linux.py" --phase prepare

    - name: Validate platform paths and direct dependencies
      if: runner.os != 'Linux' && inputs.solution != 'none'
      shell: pwsh
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        CI_PREPARE_SOLUTION: ${{ inputs.solution }}
        CI_PREPARE_GLOBAL_JSON: ${{ inputs.global-json }}
        CI_PREPARE_SUBMODULES: "${{ join(fromJSON(inputs.submodules), '\n') }}"
        CI_PREPARE_PROTECTED_CHECKOUT: ${{ runner.os == 'Windows' && inputs.windows-checkout != '' && inputs.windows-checkout != 'null' }}
        CI_PREPARE_ADDITIONAL_TEST_PROJECTS: ${{ inputs.additional-test-projects }}
      run: '& "$env:GITHUB_ACTION_PATH/prepare_windows.ps1" -Phase Validate'

    - name: Validate additional .NET 11 SDK
      if: inputs.additional-sdk-version != ''
      shell: bash
      env:
        ADDITIONAL_SDK: ${{ inputs.additional-sdk-version }}
      run: |
        [[ "$ADDITIONAL_SDK" =~ ^11\.0\.[0-9]{3}$ ]] || { echo 'Select an exact .NET 11 SDK.' >&2; exit 1; }

    - name: Set up Linux module SDK
      if: runner.os == 'Linux' && steps.linux.outputs.solution != 'none'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
      with:
        global-json-file: ${{ steps.linux.outputs.global-json }}
        dotnet-version: ${{ inputs.additional-sdk-version }}

    - name: Initialize platform direct dependencies
      if: runner.os != 'Linux' && inputs.solution != 'none'
      shell: pwsh
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        CI_PREPARE_SOLUTION: ${{ inputs.solution }}
        CI_PREPARE_GLOBAL_JSON: ${{ inputs.global-json }}
        CI_PREPARE_SUBMODULES: "${{ join(fromJSON(inputs.submodules), '\n') }}"
        CI_PREPARE_PROTECTED_CHECKOUT: ${{ runner.os == 'Windows' && inputs.windows-checkout != '' && inputs.windows-checkout != 'null' }}
        CI_PREPARE_ADDITIONAL_TEST_PROJECTS: ${{ inputs.additional-test-projects }}
      run: '& "$env:GITHUB_ACTION_PATH/prepare_windows.ps1" -Phase Dependencies'

    - name: Set up platform module SDK
      if: runner.os != 'Linux' && inputs.solution != 'none'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
      with:
        global-json-file: ${{ inputs.global-json }}
        dotnet-version: ${{ inputs.additional-sdk-version }}

    - name: Restore and build Linux module
      id: build
      if: runner.os == 'Linux' && steps.linux.outputs.solution != 'none'
      shell: bash
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        CI_REPOSITORY: ${{ github.repository }}
        CI_MODULE_ROOT: ${{ inputs.module-root }}
        CI_PREPARE_ENVIRONMENT: ${{ inputs.environment }}
        CI_CUSTOM_JOB: ${{ inputs.job-name }}
      run: python3 -I "$GITHUB_ACTION_PATH/prepare_linux.py" --phase build

    - name: Set up locked npm runtime
      if: runner.os == 'Linux' && steps.linux.outputs.solution != 'none' && steps.build.outputs.npmWorkspaces != '[]' && inputs.environment == 'setup'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Prepare Windows producer imports
      if: runner.os == 'Windows' && inputs.solution != 'none' && inputs.module-manifest != ''
      shell: pwsh
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        CI_PREPARE_SOLUTION: ${{ inputs.solution }}
        CI_PREPARE_GLOBAL_JSON: ${{ inputs.global-json }}
        CI_PREPARE_MODULE_MANIFEST: ${{ inputs.module-manifest }}
        CI_PREPARE_MODULE_AUTHORITY: ${{ inputs.module-authority }}
      run: |
        & python -I "$env:GITHUB_ACTION_PATH/../lib/module_preparation.py" --windows
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Prepare Linux environment
      if: runner.os == 'Linux' && steps.linux.outputs.solution != 'none' && inputs.environment == 'setup'
      uses: $/Github/ci-environment
      with:
        solution: ${{ steps.linux.outputs.solution }}
        dapr: ${{ steps.build.outputs.dapr }}
        browsers: ${{ steps.build.outputs.browsers }}
        registry: ${{ steps.build.outputs.registry }}
        registry-pull-username: ${{ inputs.registry-pull-username || env.REGISTRY_PULL_USERNAME }}
        registry-pull-password: ${{ inputs.registry-pull-password || env.REGISTRY_PULL_PASSWORD }}
        npm-workspaces: ${{ steps.build.outputs.npmWorkspaces }}
        dotnet-tools: ${{ steps.build.outputs.dotnetTools }}
        aspire: ${{ steps.build.outputs.aspire }}
        prerequisites: ${{ steps.build.outputs.prerequisites }}
        additional-projects: ${{ steps.build.outputs.additional-projects }}
      env:
        CI_MODULE_ROOT: ${{ inputs.module-root }}

    - name: Build prepared platform module
      if: runner.os != 'Linux' && inputs.solution != 'none'
      shell: pwsh
      env:
        REGISTRY_PULL_USERNAME: ''
        REGISTRY_PULL_PASSWORD: ''
        CI_PREPARE_SOLUTION: ${{ inputs.solution }}
        CI_PREPARE_GLOBAL_JSON: ${{ inputs.global-json }}
        CI_PREPARE_SUBMODULES: "${{ join(fromJSON(inputs.submodules), '\n') }}"
        CI_PREPARE_PROTECTED_CHECKOUT: ${{ runner.os == 'Windows' && inputs.windows-checkout != '' && inputs.windows-checkout != 'null' }}
        CI_PREPARE_DEPENDENCIES_READY: 'true'
        CI_PREPARE_ADDITIONAL_TEST_PROJECTS: ${{ inputs.additional-test-projects }}
      run: '& "$env:GITHUB_ACTION_PATH/prepare_windows.ps1" -Phase Build'
