name: Validate release draft
description: Authenticate original release data and create or complete its marked draft using trusted stdlib only.
inputs:
  mode:
    description: Validated create or complete mode from resolve.
    default: create
  draft-id:
    description: Selected marked draft identity in complete mode.
    default: ''
  last-tag:
    description: Captured stable base tag, or empty.
    default: ''
  sha:
    description: Frozen full source SHA from resolve.
    required: true
  version:
    description: Stable release version without v prefix.
    required: true
  notes:
    description: Release notes as data; reserved release trailers are forbidden.
    default: ''
  artifact-id:
    description: This run's uploaded release artifact identity in create mode.
    default: ''
  artifact-digest:
    description: Original uploaded artifact SHA-256 digest with sha256 prefix in create mode.
    default: ''
outputs:
  noop-reason:
    description: stale-draft-deleted only after confirmed complete-mode deletion, otherwise empty.
    value: ${{ steps.draft.outputs.noop-reason }}
  publish:
    description: True only after all independent draft checks pass.
    value: ${{ steps.draft.outputs.publish }}
  version:
    description: Validated stable version without v prefix.
    value: ${{ steps.draft.outputs.version }}
  sha:
    description: Validated frozen full source SHA.
    value: ${{ steps.draft.outputs.sha }}
  last-tag:
    description: Highest stable reachable tag, or empty.
    value: ${{ steps.draft.outputs.last-tag }}
  draft-id:
    description: Validated bot-authored marked draft ID.
    value: ${{ steps.draft.outputs.draft-id }}
  artifact-id:
    description: Authenticated original artifact ID.
    value: ${{ steps.draft.outputs.artifact-id }}
  artifact-digest:
    description: Authenticated original artifact SHA-256 digest.
    value: ${{ steps.draft.outputs.artifact-digest }}
  artifact-run:
    description: Authenticated original producing run ID.
    value: ${{ steps.draft.outputs.artifact-run }}
runs:
  using: composite
  steps:
    - name: Authenticate original release and process marked draft
      id: draft
      shell: bash
      env:
        RELEASE_MODE: ${{ inputs.mode }}
        RELEASE_DRAFT_ID: ${{ inputs.draft-id }}
        RELEASE_LAST_TAG: ${{ inputs.last-tag }}
        RELEASE_SHA: ${{ inputs.sha }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_NOTES: ${{ inputs.notes }}
        RELEASE_ARTIFACT_ID: ${{ inputs.artifact-id }}
        RELEASE_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
      run: |
        case "$RELEASE_MODE" in
          create) python3 -I "$GITHUB_ACTION_PATH/../lib/release_draft.py" ;;
          complete) python3 -I "$GITHUB_ACTION_PATH/../lib/release_complete.py" ;;
          *) echo 'release mode must be exactly create or complete' >&2; exit 1 ;;
        esac
