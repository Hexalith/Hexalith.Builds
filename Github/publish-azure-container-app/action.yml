name: 'Publish Azure Container App'
description: 'Publish application containers to Azure Container Apps'
inputs:
  version:
    description: 'Version number for the packages'
    required: true
  client-id:
    description: 'Client ID for the Azure administration'
    required: true
  tenant-id:
    description: 'Tenant ID for the Azure administration'
    required: true
  subscription-id:
    description: 'Subscription ID for the Azure administration'
    required: true
  resource-group:
    description: 'Resource group to deploy the containers to'
    required: true
  app-id:
    description: 'The short name of the application'
    required: true
  registry:
    description: 'Registry to publish the containers to'
    required: true

runs:
  using: "composite"
  steps:
    - name: Debug Authentication Values
      if: runner.debug == '1'
      shell: bash
      env:
        CLIENT_ID_PROVIDED: ${{ inputs.client-id != '' }}
        TENANT_ID_PROVIDED: ${{ inputs.tenant-id != '' }}
        SUBSCRIPTION_ID_PROVIDED: ${{ inputs.subscription-id != '' }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_ID: ${{ inputs.app-id }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        echo "::debug::Checking authentication values..."
        echo "::debug::Client ID provided: ${CLIENT_ID_PROVIDED}"
        echo "::debug::Tenant ID provided: ${TENANT_ID_PROVIDED}"
        echo "::debug::Subscription ID provided: ${SUBSCRIPTION_ID_PROVIDED}"
        echo "::debug::Resource Group: ${RESOURCE_GROUP}"
        echo "::debug::App ID: ${APP_ID}"
        echo "::debug::Registry: ${REGISTRY}"

    - name: Log in to Azure
      uses: azure/login@v3.0.2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        enable-AzPSSession: true
        allow-no-subscriptions: true
    - name: Deploy to Azure Container Apps
      shell: bash
      # Inputs reach the script through the environment, never through ${{ }}
      # interpolation into the script body, so an attacker-influenceable value such
      # as github.ref_name cannot break out of the argument and run as shell code.
      env:
        APP_ID: ${{ inputs.app-id }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        REGISTRY: ${{ inputs.registry }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        [[ "$VERSION" =~ $semver_pattern ]] ||
          { echo "Release version '$VERSION' must be SemVer without build metadata." >&2; exit 1; }
        [[ "$APP_ID" =~ ^[a-z0-9][a-z0-9._-]*$ ]] ||
          { echo "Application id '$APP_ID' is not a valid container repository segment." >&2; exit 1; }
        [[ "$REGISTRY" =~ ^[A-Za-z0-9.:-]+$ ]] ||
          { echo "Registry '$REGISTRY' is not a valid registry host." >&2; exit 1; }
        [[ "$RESOURCE_GROUP" =~ ^[A-Za-z0-9._()-]+$ ]] ||
          { echo "Resource group '$RESOURCE_GROUP' is not a valid Azure resource group name." >&2; exit 1; }

        # Function to update container app
        update_container_app() {
          local app_type="$1"

          az containerapp update \
            --name "${APP_ID}${app_type}" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${REGISTRY}/${APP_ID}${app_type}:${VERSION}"
        }

        update_container_app "web"
        update_container_app "api"
