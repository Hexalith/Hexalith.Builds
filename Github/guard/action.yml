name: Guard owned CI/CD content
description: Compare committed ownership, then lint custom actions, audit controls and commit policy.
outputs:
  drift:
    description: Internal perimeter drift flag; unavailable expected state and missing actions report false.
    value: ${{ steps.guard.outputs.drift }}
runs:
  using: composite
  steps:
    - name: Setup trusted guard tools runtime
      if: env.CI_REPOSITORY != 'Hexalith/Hexalith.Builds' || env.CI_MODULE_ROOT != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Compare owned CI/CD content
      id: guard
      shell: bash
      run: python3 -I "$GITHUB_ACTION_PATH/../lib/guard.py"
