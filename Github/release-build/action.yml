name: Build frozen release
description: Audit, build, pack and upload the original versioned release payload without credentials or caches.
inputs:
  sha:
    description: Frozen full release commit.
    required: true
  version:
    description: Stable release version without v prefix.
    required: true
  module-root:
    description: Test-only Builds sample root.
    default: ''
outputs:
  artifact-id:
    description: Authenticated release upload artifact identity.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-digest:
    description: SHA-256 of the original uploaded archive.
    value: ${{ format('sha256:{0}', steps.upload.outputs.artifact-digest) }}
runs:
  using: composite
  steps:
    - name: Checkout frozen release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.sha }}
        submodules: false
        persist-credentials: false
    - name: Validate frozen release configuration
      id: prepare
      shell: bash
      env:
        RELEASE_SHA: ${{ inputs.sha }}
        RELEASE_MODULE_ROOT: ${{ inputs.module-root }}
      run: python3 -I "$GITHUB_ACTION_PATH/../lib/release_build.py" --phase prepare
    - name: Set up frozen source SDK
      if: steps.prepare.outputs.solution != 'none'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: ${{ steps.prepare.outputs.global-json }}
    - name: Audit and build original payload
      shell: bash
      env:
        RELEASE_SHA: ${{ inputs.sha }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_MODULE_ROOT: ${{ inputs.module-root }}
        RELEASE_OUTPUT: ${{ runner.temp }}/hexalith-release-payload
      run: python3 -I "$GITHUB_ACTION_PATH/../lib/release_build.py" --phase build
    - name: Upload original release artifact
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release
        path: ${{ runner.temp }}/hexalith-release-payload/
        retention-days: 90
        if-no-files-found: error
        compression-level: 0
