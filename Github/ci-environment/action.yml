name: Prepare shared CI environment
description: Set up enabled Linux tools once; successful Dapr init exports HEXALITH_DAPR_INITIALIZATION_RECEIPT for fresh-backend checks.
inputs:
  solution:
    description: Validated workspace-relative solution path, including any module-root prefix.
    required: true
  dapr:
    description: Literal validated Dapr flag.
    default: 'false'
  browsers:
    description: Literal validated browser flag, including classified E2E inference.
    default: 'false'
  registry:
    description: Literal validated pull-only registry login flag.
    default: 'false'
  npm-workspaces:
    description: Validated JSON array of repository-relative npm workspace directories.
    default: '[]'
  dotnet-tools:
    description: Literal validated local .NET tool restore flag.
    default: 'false'
  aspire:
    description: Literal validated native Aspire toolchain flag.
    default: 'false'
  prerequisites:
    description: Validated JSON object selecting exact Node/npm pins and shared APT/TLS trust.
    default: '{}'
  additional-projects:
    description: Validated JSON array of additional built test projects outside the solution.
    default: '[]'
runs:
  using: composite
  steps:
    - name: Validate shared prerequisite selections
      id: prerequisites
      shell: bash
      env:
        CI_ENVIRONMENT_SOLUTION: ${{ inputs.solution }}
        CI_ENVIRONMENT_PREREQUISITES: ${{ inputs.prerequisites }}
        CI_ENVIRONMENT_NPM_WORKSPACES: ${{ inputs.npm-workspaces }}
        CI_ENVIRONMENT_DOTNET_TOOLS: ${{ inputs.dotnet-tools }}
        CI_ENVIRONMENT_DAPR: ${{ inputs.dapr }}
        CI_ENVIRONMENT_ASPIRE: ${{ inputs.aspire }}
        CI_ENVIRONMENT_REGISTRY: ${{ inputs.registry }}
        CI_ENVIRONMENT_ADDITIONAL_PROJECTS: ${{ inputs.additional-projects }}
      run: python3 -I "$GITHUB_ACTION_PATH/../lib/ci_environment.py" --phase inputs

    - name: Install selected exact Node runtime
      if: steps.prerequisites.outputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.prerequisites.outputs.node-version }}
        package-manager-cache: false

    - name: Set up enabled environment tools
      shell: bash
      env:
        CI_ENVIRONMENT_SOLUTION: ${{ inputs.solution }}
        CI_ENVIRONMENT_DAPR: ${{ inputs.dapr }}
        CI_ENVIRONMENT_BROWSERS: ${{ inputs.browsers }}
        CI_ENVIRONMENT_REGISTRY: ${{ inputs.registry }}
        CI_ENVIRONMENT_NPM_WORKSPACES: ${{ inputs.npm-workspaces }}
        CI_ENVIRONMENT_DOTNET_TOOLS: ${{ inputs.dotnet-tools }}
        CI_ENVIRONMENT_ASPIRE: ${{ inputs.aspire }}
        CI_ENVIRONMENT_PREREQUISITES: ${{ inputs.prerequisites }}
        CI_ENVIRONMENT_ADDITIONAL_PROJECTS: ${{ inputs.additional-projects }}
      run: python3 -I "$GITHUB_ACTION_PATH/../lib/ci_environment.py"
