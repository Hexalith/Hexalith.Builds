name: 'Publish Application Containers'
description: 'Publish application containers to container registry'

inputs:
  app-id:
    description: 'The short name of the application'
    required: true
  version:
    description: 'Version number for the packages'
    required: true
  registry:
    description: 'Registry to publish the containers to'
    required: true
  username:
    description: 'Username for the container registry'
    required: true
  password:
    description: 'Password for the container registry'
    required: true

runs:
  using: "composite"
  steps:
    - name: Initialize HexalithApp and Hexalith.Builds submodules
      shell: bash
      run: |
        set -euo pipefail
        # Check out the gitlinks the caller committed. The previous
        # `git checkout main && git pull` discarded those pins and built whatever
        # happened to be on main at that moment, making the published image
        # unreproducible from the release commit.
        git -c submodule.recurse=false submodule update --init HexalithApp
        git -c submodule.recurse=false submodule update --init references/Hexalith.Builds
    - name: Login to the container registry
      uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Publish and push the server images to the container registry
      shell: bash
      # Inputs reach the script through the environment, never through ${{ }}
      # interpolation into the script body: callers are documented to pass
      # github.ref_name as `version`, which an attacker can influence by pushing a
      # crafted tag or branch name, and interpolation would run it as shell code.
      env:
        APP_ID: ${{ inputs.app-id }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail

        semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        [[ "$VERSION" =~ $semver_pattern ]] ||
          { echo "Release version '$VERSION' must be SemVer without build metadata." >&2; exit 1; }
        [[ "$APP_ID" =~ ^[a-z0-9][a-z0-9._-]*$ ]] ||
          { echo "Application id '$APP_ID' is not a valid container repository segment." >&2; exit 1; }
        [[ "$REGISTRY" =~ ^[A-Za-z0-9.:-]+$ ]] ||
          { echo "Registry '$REGISTRY' is not a valid registry host." >&2; exit 1; }

        publish_container() {
          local app_type="$1"
          local project_name="HexalithApp.${app_type}Server"
          local project_path="./HexalithApp/src/${project_name}/${project_name}.csproj"
          local app_type_lower
          app_type_lower="$(echo "$app_type" | tr '[:upper:]' '[:lower:]')"
          local repo="${APP_ID}${app_type_lower}"

          echo "Publishing project ${project_name} to ${repo}"
          if [ ! -f "$project_path" ]; then
            echo "Error: Project file not found at $project_path" >&2
            return 1
          fi

          echo "Publishing container for ${project_path}..."
          dotnet publish "$project_path" \
            /t:PublishContainer \
            --configuration Release \
            --os linux \
            --arch x64 \
            -p:ContainerImageTags="\"${VERSION};latest\"" \
            -p:ContainerRegistry="$REGISTRY" \
            -p:ContainerRepository="$repo" \
            -p:Version="$VERSION" \
            -p:FileVersion="$VERSION"
        }

        publish_container "Web"
        publish_container "Api"
