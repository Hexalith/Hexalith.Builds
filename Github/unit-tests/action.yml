name: 'Run Unit Tests'
description: 'Runs unit tests and cleans the solution'

inputs:
  project-name:
    description: 'The name of the project'
    required: true

runs:
  using: composite
  steps:
    # Inputs reach the shell through the environment rather than ${{ }}
    # interpolation, so a crafted project name cannot execute as shell code.
    - name: Run Unit Tests
      shell: pwsh
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
      run: dotnet test -c Release "./test/$env:PROJECT_NAME.Tests/$env:PROJECT_NAME.Tests.csproj" -p:GeneratePackageOnBuild=false

    - name: Clean Solution
      shell: pwsh
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
      run: dotnet clean "./test/$env:PROJECT_NAME.Tests/$env:PROJECT_NAME.Tests.csproj"
