name: Publish archive spike
description: Temporary remote-composite OCI and NuGet boundary experiment
inputs:
  nuget-user:
    description: Caller organization variable selected for Builds
    required: true
  nuget-api-key:
    description: Caller-login fallback, exercised only after discriminating nested failure
    default: ''
  login-only:
    description: Observe login without consuming an artifact
    default: 'false'
  artifact-id:
    description: Exact producing artifact ID
    default: ''
  artifact-digest:
    description: Authenticated upload archive digest
    default: ''
  artifact-run-id:
    description: Original producing run
    default: ''
  source-revision:
    description: Exact producer source revision
    default: ''
  registry-username:
    description: Explicit isolated repository push principal
    default: ''
  registry-password:
    description: Explicit isolated repository password
    default: ''
  repository:
    description: Exact isolated repository
    default: ''
  tag:
    description: Exact isolated version tag
    default: ''
  evidence:
    description: Sanitized result file
    default: ''
outputs:
  login-outcome:
    description: Nested NuGet login outcome for the caller control
    value: ${{ steps.login.outcome }}
runs:
  using: composite
  steps:
    - name: Nested NuGet login
      id: login
      if: inputs.nuget-api-key == ''
      continue-on-error: true
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nuget-user }}
    - name: Consume trusted archive or observe login
      shell: bash
      env:
        TRUSTED_ACTION_PATH: ${{ github.action_path }}
        NUGET_API_KEY: ${{ inputs.nuget-api-key || steps.login.outputs.NUGET_API_KEY }}
        LOGIN_ONLY: ${{ inputs.login-only }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        SOURCE_REVISION: ${{ inputs.source-revision }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        SPIKE_REPOSITORY: ${{ inputs.repository }}
        SPIKE_TAG: ${{ inputs.tag }}
        SPIKE_EVIDENCE: ${{ inputs.evidence }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ "$LOGIN_ONLY" = true ]; then
          python3 -I "$TRUSTED_ACTION_PATH/../lib/publish_spike.py" --login-only
        else
          python3 -I "$TRUSTED_ACTION_PATH/../lib/publish_spike.py"
        fi
