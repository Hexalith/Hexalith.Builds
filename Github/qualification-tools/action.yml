name: Stage isolated qualification tools
description: Verify exact official tools, optionally initializing an explicit Dapr tuple on a fresh hosted worker.
inputs:
  manifest:
    description: Module-relative hexalith.qualification-tools.v1 JSON manifest of official immutable assets.
    required: true
  dapr-runtime-version:
    description: Optional exact historical runtime >=1.18.0 to initialize once on a fresh hosted Linux worker; requires a verified dapr CLI artifact.
    default: ''
outputs:
  directory:
    description: Fresh private job directory containing only verified files and the receipt.
    value: ${{ steps.stage.outputs.directory }}
  receipt:
    description: Integrity receipt; installation never establishes runtime qualification.
    value: ${{ steps.stage.outputs.receipt }}
  files:
    description: JSON mapping of configured artifact names to their verified absolute paths.
    value: ${{ steps.stage.outputs.files }}
  dapr-receipt:
    description: Shared job-bound initialization receipt when requested; never runtime qualification or promotion evidence.
    value: ${{ steps.stage.outputs.dapr-receipt }}
runs:
  using: composite
  steps:
    - name: Stage and authenticate selected official artifacts
      id: stage
      shell: bash
      env:
        QUALIFICATION_TOOL_MANIFEST: ${{ inputs.manifest }}
        QUALIFICATION_DAPR_RUNTIME: ${{ inputs.dapr-runtime-version }}
      run: python3 -I "$GITHUB_ACTION_PATH/../lib/qualification_tools.py" --manifest "$QUALIFICATION_TOOL_MANIFEST" --dapr-runtime-version "$QUALIFICATION_DAPR_RUNTIME"
