name: Create Release
description: 'Run the repository-configured semantic-release lifecycle (version, changelog, optional package lifecycle, GitHub release)'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # Pin the major line: semantic-release 25 requires ^22.14.0 || >=24.10.0, and
        # 'node' (latest) would silently jump majors on a publication path.
        node-version: '22'

    - name: Install semantic-release dependencies
      shell: bash
      run: npm ci

    - name: Verify dependency provenance and signatures
      shell: bash
      run: npm audit signatures

    - name: Semantic Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        NUGET_API_KEY: ${{ env.NUGET_API_KEY }}
      run: npx semantic-release
