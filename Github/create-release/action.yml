name: Create Release
description: 'Run the repository-configured semantic-release lifecycle (version, changelog, optional package lifecycle, GitHub release)'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        # Pin the major line: 'node' (latest) would silently jump majors on a
        # publication path. 24 is Active LTS, satisfies semantic-release 25's
        # >=24.10.0, and ships the npm 11 that package-lock.json was built with.
        node-version: '24'

    - name: Install semantic-release dependencies
      shell: bash
      run: npm ci

    - name: Verify dependency provenance and signatures
      shell: bash
      run: npm audit signatures

    - name: Semantic Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        NUGET_API_KEY: ${{ env.NUGET_API_KEY }}
      run: npx semantic-release
