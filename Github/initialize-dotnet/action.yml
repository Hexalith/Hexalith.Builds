name: 'Initialize .NET Framework'
description: 'Sets up the .NET SDK (pinned version or from global.json) and optionally installs the Aspire workload'
inputs:
  global-json-file:
    description: 'Path to a global.json pinning the SDK version. Takes precedence over dotnet-version when set.'
    required: false
    default: ''
  dotnet-version:
    description: 'Explicit .NET SDK version to install when global-json-file is not provided'
    required: false
    default: '11.0.100'
  aspire:
    description: 'Whether to install Aspire workload'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Validate selected .NET 11 SDK
      shell: pwsh
      env:
        GLOBAL_FILE: ${{ inputs.global-json-file }}
        EXPLICIT_SDK: ${{ inputs.dotnet-version }}
      run: |
        $sdk = if ($env:GLOBAL_FILE) { (Get-Content -Raw -LiteralPath $env:GLOBAL_FILE | ConvertFrom-Json).sdk.version } else { $env:EXPLICIT_SDK }
        if ($sdk -notmatch '^11\.0\.(?:[0-9]{3}|x)\z') { throw 'Select a .NET 11 SDK.' }
    - name: Setup .NET from global.json
      if: inputs.global-json-file != ''
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: ${{ inputs.global-json-file }}
    - name: Setup .NET ${{ inputs.dotnet-version }}
      if: inputs.global-json-file == ''
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Add Aspire Workloads
      if: inputs.aspire != ''
      shell: bash
      run: dotnet workload install aspire
