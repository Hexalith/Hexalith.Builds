name: Update EventStore package family
on:
  schedule:
    - cron: '24 5 * * *'
  workflow_dispatch:

concurrency:
  group: update-eventstore-catalog
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select latest stable release published for all members
        id: select
        run: |
          version=$(python3 Tools/ci/update_eventstore.py --write)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet -- Props/Directory.Packages.props; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./Github/initialize-dotnet
        if: steps.select.outputs.changed == 'true'
        with:
          global-json-file: global.json
      - name: Commit the family selection and its revision-bound audit
        if: steps.select.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.select.outputs.version }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "automation/eventstore-$VERSION"
          cp Tools/package-version-audit.json "$RUNNER_TEMP/prior-audit.json"
          git add Props/Directory.Packages.props
          git commit -m "build(deps): update eventstore family to $VERSION"
          pwsh -NoProfile -File Tools/audit-central-package-versions.ps1 -ChangedFamily hexalith-eventstore -PriorAuditPath "$RUNNER_TEMP/prior-audit.json" -OutputPath Tools/package-version-audit.json
          pwsh -NoProfile -File Tools/validate-package-version-audit.ps1
          git add Tools/package-version-audit.json
          git commit -m "build(deps): refresh eventstore family audit"
      - name: Open the update for review and run CI on the audited revision
        if: steps.select.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          branch="automation/eventstore-$VERSION"
          gh auth setup-git
          if ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            git push origin "HEAD:refs/heads/$branch"
          fi
          if ! gh pr view "$branch" --json state --jq .state | grep -qx OPEN; then
            gh pr create --base main --head "$branch" --title "build(deps): update eventstore family to $VERSION" --body 'Updates all EventStore packages together. Merge with a merge commit to retain the source revision recorded by the audit.'
          fi
          # Pull requests created with GITHUB_TOKEN need an explicit CI dispatch.
          runs=$(gh run list --workflow builds-ci.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId --jq length)
          if [ "$runs" = 0 ]; then
            gh workflow run builds-ci.yml --ref "$branch"
          fi
