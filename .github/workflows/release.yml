name: Shared release

on:
  workflow_call:
    inputs:
      delivered-sha:
        description: Exact live delivered commit or ancestor; omitted uses the live delivered branch tip.
        type: string
        default: ''
      ci-workflow:
        description: Exact CI filename; only Builds may pass builds-ci.yml.
        type: string
        default: ci.yml
      release-rules:
        description: Version rules; builds is restricted to the actual Builds repository.
        type: string
        default: module
      module-root:
        description: Test-only Builds sample module root.
        type: string
        default: ''
      expected-source:
        description: Test-only Builds sample delivered-layout fixture, paired with module-root.
        type: string
        default: ''
    secrets:
      registry-pull-username:
        description: Dedicated pull-only registry identity for enabled setup or complete-mode image existence checks.
        required: false
      registry-pull-password:
        description: Password for the dedicated pull-only registry identity.
        required: false
    outputs:
      sha:
        description: Frozen release SHA, which may differ from the dispatch SHA in complete mode.
        value: ${{ jobs.resolve.outputs.sha }}
      mode:
        description: Selected create or complete mode.
        value: ${{ jobs.resolve.outputs.mode }}
      publish:
        description: String publication handoff flag; true only after every gate and the draft validate.
        value: ${{ jobs.outcome.outputs.publish }}
      version:
        description: Stable version independently validated by the draft stage.
        value: ${{ jobs.draft.outputs.version }}
      last-tag:
        description: Highest stable tag reachable from the frozen source.
        value: ${{ jobs.draft.outputs.last-tag }}
      draft-id:
        description: Validated bot-authored draft release identity.
        value: ${{ jobs.draft.outputs.draft-id }}
      artifact-id:
        description: Authenticated original release artifact identity.
        value: ${{ jobs.draft.outputs.artifact-id }}
      artifact-digest:
        description: Authenticated artifact SHA-256 digest including its sha256 prefix.
        value: ${{ jobs.draft.outputs.artifact-digest }}
      artifact-run:
        description: Run that uploaded the original release payload.
        value: ${{ jobs.draft.outputs.artifact-run }}

permissions: {}
cache-mode: none

jobs:
  resolve:
    name: Resolve release identity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      enabled: ${{ steps.resolve.outputs.enabled }}
      codeql: ${{ steps.resolve.outputs.codeql }}
      nightly-hook: ${{ steps.resolve.outputs.nightly-hook }}
      config-valid: ${{ steps.resolve.outputs.config-valid }}
      version: ${{ steps.resolve.outputs.version }}
      draft-id: ${{ steps.resolve.outputs.draft-id }}
      last-tag: ${{ steps.resolve.outputs.last-tag }}
    steps:
      - name: Read dispatch settings and freeze release source
        id: resolve
        uses: $/Github/release-resolve
        with:
          delivered-sha: ${{ inputs.delivered-sha }}
          ci-workflow: ${{ inputs.ci-workflow }}
          module-root: ${{ inputs.module-root }}
          expected-source: ${{ inputs.expected-source }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SWITCH: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}

  codeql:
    name: Release CodeQL (${{ matrix.language }})
    needs: resolve
    # Run after resolve failures, but honor run cancellation.
    if: ${{ !cancelled() && needs.resolve.outputs.config-valid == 'true' && needs.resolve.outputs.codeql != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Skipped jobs never expand an empty or missing list: both '[]' and an
        # absent output use a placeholder that the job condition never runs.
        language: ${{ fromJSON(needs.resolve.outputs.codeql != '[]' && needs.resolve.outputs.codeql || '["csharp"]') }}
    steps:
      - name: Checkout dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Initialize release analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze and wait for processing
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: hexalith-release/${{ matrix.language }}
          wait-for-processing: true

      - name: Check processed release security findings
        uses: $/Github/release-security
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}

  nightly-hook:
    name: Prepare and run nightly hook
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.outputs.config-valid == 'true' && needs.resolve.outputs.nightly-hook == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Prepare dispatch source and Linux environment
        uses: $/Github/prepare
        with:
          module-root: ${{ inputs.module-root }}
        env:
          REGISTRY_PULL_USERNAME: ${{ secrets.registry-pull-username }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.registry-pull-password }}

      - name: Run enabled nightly hook
        uses: ./.github/actions/nightly

  version:
    name: Compute release version
    needs: [resolve, codeql, nightly-hook]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' &&
          needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.mode == 'create' &&
          (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') &&
          (needs.nightly-hook.result == 'success' || needs.nightly-hook.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
      last-tag: ${{ steps.version.outputs.last-tag }}
      no-version: ${{ steps.version.outputs.no-version }}
    steps:
      - name: Analyze the frozen release range
        id: version
        uses: $/Github/release-version
        with:
          sha: ${{ needs.resolve.outputs.sha }}
          release-rules: ${{ inputs.release-rules }}
          module-root: ${{ inputs.module-root }}

  build:
    name: Build audited release payload
    needs: [resolve, codeql, nightly-hook, version]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' &&
          needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.mode == 'create' &&
          (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') &&
          (needs.nightly-hook.result == 'success' || needs.nightly-hook.result == 'skipped') &&
          needs.version.result == 'success' && needs.version.outputs.no-version == 'false' &&
          needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
    steps:
      - name: Build once and retain the original versioned payload
        id: build
        uses: $/Github/release-build
        with:
          sha: ${{ needs.resolve.outputs.sha }}
          version: ${{ needs.version.outputs.version }}
          module-root: ${{ inputs.module-root }}

  draft:
    name: Authenticate original artifact and process marked draft
    needs: [resolve, codeql, nightly-hook, version, build]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' &&
          needs.resolve.outputs.enabled == 'true' &&
          (needs.codeql.result == 'success' ||
           (needs.codeql.result == 'skipped' && needs.resolve.outputs.codeql == '[]')) &&
          (needs.nightly-hook.result == 'success' ||
           (needs.nightly-hook.result == 'skipped' && needs.resolve.outputs.nightly-hook == 'false')) &&
          ((needs.resolve.outputs.mode == 'complete' && needs.version.result == 'skipped' &&
            needs.build.result == 'skipped') ||
           (needs.resolve.outputs.mode == 'create' && needs.version.result == 'success' &&
            needs.version.outputs.no-version == 'false' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      noop-reason: ${{ steps.draft.outputs.noop-reason }}
      publish: ${{ steps.draft.outputs.publish }}
      version: ${{ steps.draft.outputs.version }}
      sha: ${{ steps.draft.outputs.sha }}
      last-tag: ${{ steps.draft.outputs.last-tag }}
      draft-id: ${{ steps.draft.outputs.draft-id }}
      artifact-id: ${{ steps.draft.outputs.artifact-id }}
      artifact-digest: ${{ steps.draft.outputs.artifact-digest }}
      artifact-run: ${{ steps.draft.outputs.artifact-run }}
    steps:
      - name: Authenticate and create or complete the release draft
        id: draft
        uses: $/Github/release-draft
        with:
          mode: ${{ needs.resolve.outputs.mode }}
          draft-id: ${{ needs.resolve.outputs.draft-id }}
          last-tag: ${{ needs.resolve.outputs.last-tag }}
          sha: ${{ needs.resolve.outputs.sha }}
          version: ${{ needs.resolve.outputs.mode == 'complete' && needs.resolve.outputs.version || needs.version.outputs.version }}
          notes: ${{ needs.version.outputs.notes }}
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          artifact-digest: ${{ needs.build.outputs.artifact-digest }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          REGISTRY_PULL_USERNAME: ${{ secrets.registry-pull-username }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.registry-pull-password }}

  outcome:
    name: Report release outcome
    needs: [resolve, codeql, nightly-hook, version, build, draft]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
    steps:
      - name: Decide outcome with failure precedence
        id: decision
        uses: $/Github/release-outcome
        env:
          RELEASE_DISPATCH_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_MODE: ${{ needs.resolve.outputs.mode }}
          RELEASE_VERSION: ${{ needs.draft.outputs.version || needs.version.outputs.version || needs.resolve.outputs.version }}
          RELEASE_ENABLED: ${{ needs.resolve.outputs.enabled }}
          RELEASE_CODEQL: ${{ needs.resolve.outputs.codeql }}
          RELEASE_NIGHTLY_HOOK: ${{ needs.resolve.outputs.nightly-hook }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RELEASE_PUBLISH: ${{ needs.draft.outputs.publish || 'false' }}
          RELEASE_NOOP_REASON: ${{ needs.draft.outputs.noop-reason || (needs.version.outputs.no-version == 'true' && 'no-version' || '') }}
          RELEASE_OUTPUT_DIRECTORY: ${{ runner.temp }}/hexalith-release-outcome

      - name: Upload the sole reusable outcome
        if: always() && steps.decision.outputs.upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hexalith-release-outcome
          path: ${{ steps.decision.outputs.path }}
          overwrite: true
          if-no-files-found: error
