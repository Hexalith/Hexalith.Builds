name: Hexalith Domain CI v2

on:
  workflow_call:
    inputs:
      solution:
        description: 'Path to the .slnx/.sln solution to restore and build.'
        required: true
        type: string
      module-manifest:
        description: 'Required v2 declaration for exact pinned tool package/Release integration; requires a qualified producer release.'
        required: true
        type: string
      dotnet-global-json:
        description: 'Path to global.json pinning the .NET SDK.'
        required: false
        type: string
        default: 'global.json'
      packages-lock-file:
        description: >-
          Comma-separated hashFiles() patterns for the NuGet cache key. The default
          covers the module package props, global.json, and the shared package props
          imported from the Hexalith.Builds submodule; patterns that match nothing
          are simply ignored.
        required: false
        type: string
        default: 'Directory.Packages.props, global.json, references/Hexalith.Builds/Props/Directory.Packages.props'
      test-platform:
        description: >-
          Test command contract: vstest uses --logger/--collect; microsoft-testing-platform
          uses the xUnit v3 MTP reporter, trait-filter, and Microsoft coverage options.
        required: false
        type: string
        default: 'vstest'
      unit-test-projects:
        description: 'Newline-separated Tier 1 test project paths (no Dapr).'
        required: false
        type: string
        default: ''
      integration-test-projects:
        description: 'Retired direct integration input; migrate to module-manifest and integration-test-profiles.'
        required: false
        type: string
        default: ''
      integration-test-profiles:
        description: 'Required nonempty declared package-mode suite names.'
        required: true
        type: string
      aspire-test-project:
        description: 'Retired advisory AppHost input; use declared package integration suites.'
        required: false
        type: string
        default: ''
      run-consumer-validation:
        description: 'Run scripts/pack + validate-nuget + validate-consumer package checks.'
        required: false
        type: boolean
        default: false
      package-prepare-script:
        description: 'Optional repository-relative bash script preparing package dependencies before restore. Existing build, test and consumer gates remain unchanged.'
        required: false
        type: string
        default: ''
      run-coverage-gate:
        description: 'Run scripts/validate-coverage.py over TestResults.'
        required: false
        type: boolean
        default: false
      coverage-minimum-line:
        description: 'Minimum line coverage percentage.'
        required: false
        type: number
        default: 80
      coverage-required-branch:
        description: 'Required branch coverage percentage.'
        required: false
        type: number
        default: 100
      coverage-isolation-targets:
        description: 'Newline-separated files passed as --isolation-auth-target.'
        required: false
        type: string
        default: ''
      coverage-line-scope:
        description: >-
          Newline-separated source path prefixes passed as --line-scope to
          scripts/validate-coverage.py (the production projects the line gate is
          scoped to). When empty, the script falls back to its built-in default.
        required: false
        type: string
        default: ''
      build-timeout-minutes:
        required: false
        type: number
        default: 45
      governed-ci:
        description: >-
          Opt into the BUILD-REL-1 / GOV-1 governed CI contract: validate the actual
          reusable-workflow identity, evaluate the bounded static workflow/composite
          closure, and emit the provenance the caller needs for its
          hexalith.dependency-release-handoff.v1 artifact. Leave unset to keep the
          pre-BUILD-REL-1 CI contract exactly.
        required: false
        type: boolean
        default: false
      builds-execution-sha:
        description: 'Exact approved Hexalith.Builds commit resolved for this reusable workflow. Required in governed mode.'
        required: false
        type: string
        default: ''
      candidate-commit:
        description: 'Exact candidate commit the governed CI run evaluates. Required in governed mode.'
        required: false
        type: string
        default: ''
      dependency-policy-repository:
        description: 'Normalized github.com/owner/repository identity owning the active dependency policy.'
        required: false
        type: string
        default: ''
      dependency-policy-path:
        description: 'Repository-relative path of the active dependency policy.'
        required: false
        type: string
        default: ''
      dependency-policy-commit:
        description: 'Exact commit of the active dependency policy.'
        required: false
        type: string
        default: ''
      dependency-policy-sha256:
        description: 'Exact SHA-256 of the active dependency-policy bytes.'
        required: false
        type: string
        default: ''
      expected-ci-evaluator-digest:
        description: 'Expected CI evaluator-authorization digest recorded into the governed provenance.'
        required: false
        type: string
        default: ''
    secrets:
      registry-pull-username:
        description: 'Dedicated pull-only registry.hexalith.com identity; no publisher or provider account.'
        required: true
      registry-pull-password:
        description: 'Password for the dedicated pull-only registry identity.'
        required: true
    outputs:
      governed-candidate:
        description: 'Exact candidate commit the governed CI run evaluated.'
        value: ${{ jobs.build-and-test.outputs.governed-candidate }}
      governed-provenance-json:
        description: 'Complete governed-provenance document as compact canonical JSON.'
        value: ${{ jobs.build-and-test.outputs.governed-provenance-json }}
      governed-provenance-sha256:
        description: 'SHA-256 of the emitted governed-provenance document bytes.'
        value: ${{ jobs.build-and-test.outputs.governed-provenance-sha256 }}
      governed-closure-digest:
        description: 'Canonical digest of the evaluated governed reusable/composite closure.'
        value: ${{ jobs.build-and-test.outputs.governed-closure-digest }}
      governed-reusable-repository:
        description: 'Normalized identity of the repository owning the governed reusable workflow.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-repository }}
      governed-reusable-workflow-path:
        description: 'Repository-relative path of the governed reusable workflow.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-workflow-path }}
      governed-reusable-commit:
        description: 'Exact commit the governed reusable workflow executed from.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-commit }}
      governed-reusable-blob-sha256:
        description: 'SHA-256 of the governed domain-ci-v2.yml blob that executed.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-blob-sha256 }}
      governed-actions-json:
        description: 'Canonical JSON array of the local composite-action sources in the governed closure.'
        value: ${{ jobs.build-and-test.outputs.governed-actions-json }}
      governed-external-actions-json:
        description: 'Canonical JSON array of the pinned external action coordinates in the governed closure.'
        value: ${{ jobs.build-and-test.outputs.governed-external-actions-json }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    outputs:
      governed-candidate: ${{ steps.governed-provenance.outputs.candidate }}
      governed-provenance-json: ${{ steps.governed-provenance.outputs.provenance-json }}
      governed-provenance-sha256: ${{ steps.governed-provenance.outputs.provenance-sha256 }}
      governed-closure-digest: ${{ steps.governed-provenance.outputs.closure-digest }}
      governed-reusable-repository: ${{ steps.governed-provenance.outputs.reusable-repository }}
      governed-reusable-workflow-path: ${{ steps.governed-provenance.outputs.reusable-workflow-path }}
      governed-reusable-commit: ${{ steps.governed-provenance.outputs.reusable-commit }}
      governed-reusable-blob-sha256: ${{ steps.governed-provenance.outputs.reusable-blob-sha256 }}
      governed-actions-json: ${{ steps.governed-provenance.outputs.actions-json }}
      governed-external-actions-json: ${{ steps.governed-provenance.outputs.external-actions-json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
      - name: Validate governed CI contract
        if: ${{ inputs.governed-ci }}
        shell: bash
        env:
          BUILDS_EXECUTION_SHA: ${{ inputs.builds-execution-sha }}
          CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          POLICY_REPOSITORY: ${{ inputs.dependency-policy-repository }}
          POLICY_PATH: ${{ inputs.dependency-policy-path }}
          POLICY_COMMIT: ${{ inputs.dependency-policy-commit }}
          POLICY_SHA256: ${{ inputs.dependency-policy-sha256 }}
          EXPECTED_EVALUATOR_DIGEST: ${{ inputs.expected-ci-evaluator-digest }}
          RESOLVED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RESOLVED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          RESOLVED_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          failures=0
          reject() {
            echo "$1" >&2
            failures=$((failures + 1))
          }

          if [[ ! "$BUILDS_EXECUTION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            reject "governed CI requires builds-execution-sha to be an exact lowercase 40-character commit SHA."
          fi
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            reject "governed CI requires candidate-commit to be an exact lowercase 40-character commit SHA."
          fi
          if [[ ! "$POLICY_REPOSITORY" =~ ^github\.com/[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            reject "governed CI requires dependency-policy-repository as a normalized github.com/owner/repository identity."
          fi
          if [ -z "${POLICY_PATH//[[:space:]]/}" ] || [[ "$POLICY_PATH" == /* ]]; then
            reject "governed CI requires dependency-policy-path as a non-empty relative path."
          fi
          if [[ ! "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            reject "governed CI requires dependency-policy-commit to be an exact lowercase 40-character commit SHA."
          fi
          if [[ ! "$POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            reject "governed CI requires dependency-policy-sha256 to be an exact lowercase 64-character SHA-256."
          fi
          if [[ ! "$EXPECTED_EVALUATOR_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            reject "governed CI requires expected-ci-evaluator-digest to be an exact lowercase 64-character SHA-256."
          fi
          if [ "$RESOLVED_WORKFLOW_REPOSITORY" != "Hexalith/Hexalith.Builds" ]; then
            reject "The governed CI job is not defined by the approved Hexalith.Builds repository."
          fi
          if [ "$RESOLVED_WORKFLOW_SHA" != "$BUILDS_EXECUTION_SHA" ]; then
            reject "Resolved reusable-workflow SHA does not match the approved builds-execution-sha."
          fi
          if [[ "$RESOLVED_WORKFLOW_REF" != Hexalith/Hexalith.Builds/.github/workflows/domain-ci-v2.yml@* ]]; then
            reject "Resolved job.workflow_ref does not name Hexalith/Hexalith.Builds/.github/workflows/domain-ci-v2.yml."
          fi
          if [ "$CANDIDATE_COMMIT" != "$EVENT_HEAD_SHA" ]; then
            reject "governed CI candidate-commit must be the exact commit this CI run evaluates."
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$CANDIDATE_COMMIT" ]; then
            reject "The checked-out CI source does not match the declared exact candidate."
          fi

          if [ "$failures" -ne 0 ]; then
            echo "Rejected $failures governed CI contract violation(s)." >&2
            exit 1
          fi
      - name: Checkout approved Builds actions
        if: ${{ inputs.governed-ci }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: ${{ inputs.builds-execution-sha }}
          path: .hexalith/builds-execution
          persist-credentials: false
      - name: Evaluate governed workflow provenance
        id: governed-provenance
        if: ${{ inputs.governed-ci }}
        uses: ./.hexalith/builds-execution/Github/governed-provenance
        with:
          stage: ci
          builds-execution-sha: ${{ inputs.builds-execution-sha }}
          workflow-path: .github/workflows/domain-ci-v2.yml
          candidate: ${{ inputs.candidate-commit }}
          dependency-policy-repository: ${{ inputs.dependency-policy-repository }}
          dependency-policy-path: ${{ inputs.dependency-policy-path }}
          dependency-policy-commit: ${{ inputs.dependency-policy-commit }}
          dependency-policy-sha256: ${{ inputs.dependency-policy-sha256 }}
          expected-evaluator-digest: ${{ inputs.expected-ci-evaluator-digest }}
          output: .hexalith/ci/governed/ci-workflow-provenance.json
      # Two forms of the same composite. Governed mode must load Builds-owned composites
      # from the reusable-workflow commit itself, which only the governed checkout above
      # provides; a legacy caller never checks Builds out, so it consumes the pinned copy.
      - name: Initialize root-declared submodules (governed)
        if: ${{ inputs.governed-ci }}
        uses: ./.hexalith/builds-execution/Github/initialize-build
      - name: Initialize root-declared submodules
        if: ${{ !inputs.governed-ci }}
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@e171c5a788eab183b32683431b084198c9b8d373 # BUILD-REL-1
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.dotnet-global-json }}
      - name: Checkout workflow-owned Builds preparation
        if: ${{ inputs.module-manifest != '' && !inputs.governed-ci }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: ${{ job.workflow_sha }}
          path: .hexalith/builds-execution
          persist-credentials: false
      - name: Prepare module build
        if: ${{ inputs.module-manifest != '' }}
        uses: ./.hexalith/builds-execution/Github/prepare-module-build
        with:
          manifest: ${{ inputs.module-manifest }}
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles(inputs.packages-lock-file) }}
          restore-keys: nuget-
      - name: Validate test platform input
        if: ${{ inputs.test-platform != 'vstest' && inputs.test-platform != 'microsoft-testing-platform' }}
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test-platform }}
        run: |
          echo "Unsupported test-platform '$TEST_PLATFORM'. Expected vstest or microsoft-testing-platform." >&2
          exit 1
      - name: Prepare package dependencies
        if: ${{ inputs.package-prepare-script != '' }}
        timeout-minutes: 31
        shell: bash
        env:
          PACKAGE_PREPARE_SCRIPT: ${{ inputs.package-prepare-script }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_PREPARE_SCRIPT" =~ ^[A-Za-z0-9_./-]+\.sh$ || "$PACKAGE_PREPARE_SCRIPT" = /* || "$PACKAGE_PREPARE_SCRIPT" =~ (^|/)\.\.?(/|$) || ! -f "$PACKAGE_PREPARE_SCRIPT" ]]; then
            echo "Package preparation must select an existing repository-relative bash script." >&2
            exit 1
          fi
          checked_path="$PACKAGE_PREPARE_SCRIPT"
          while [ "$checked_path" != . ]; do
            if [ -L "$checked_path" ]; then
              echo "Package preparation forbids symbolic links." >&2
              exit 1
            fi
            checked_path="$(dirname "$checked_path")"
          done
          timeout --signal=TERM --kill-after=30s 1800 bash "$PACKAGE_PREPARE_SCRIPT" </dev/null
      - name: Restore
        env:
          SOLUTION: ${{ inputs.solution }}
        run: dotnet restore "$SOLUTION" -p:Configuration=Release
      - name: Build
        env:
          SOLUTION: ${{ inputs.solution }}
        run: dotnet build "$SOLUTION" --no-restore --configuration Release -warnaserror
      - name: Validate package consumer references
        if: ${{ inputs.run-consumer-validation }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./nupkgs
          python3 scripts/pack-release-packages.py ./nupkgs 0.0.0-ci-test
          python3 scripts/validate-nuget-packages.py ./nupkgs
          python3 scripts/validate-consumer-package-references.py ./nupkgs
      - name: Unit tests (Tier 1, VSTest)
        id: unit-tests-vstest
        if: ${{ inputs.unit-test-projects != '' && inputs.test-platform == 'vstest' }}
        shell: bash
        env:
          UNIT_TEST_PROJECTS: ${{ inputs.unit-test-projects }}
        run: |
          set -euo pipefail
          failures=0
          {
            echo "## Tier 1 Unit Tests (VSTest)"
            echo
            echo "| Project | Status | Exit code |"
            echo "| --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            name=$(basename "$proj")
            result_file="TestResults/${name}/${name}.trx"
            rm -f -- "$result_file"
            mkdir -p "TestResults/${name}"
            report_marker="TestResults/${name}/.started"
            touch "$report_marker"
            summary_proj=${proj//\\/\\\\}
            summary_proj=${summary_proj//|/\\|}
            summary_proj=${summary_proj//\`/\\\`}
            if dotnet test "$proj" --no-build --configuration Release \
                --logger "trx;LogFileName=${name}.trx" \
                --results-directory "TestResults/${name}" \
                --collect:"XPlat Code Coverage" </dev/null; then
              status=PASS
              exit_code=0
            else
              exit_code=$?
              annotation_proj=${proj//%/%25}
              if [ ! -f "$result_file" ]; then
                annotation_result_file=${result_file//%/%25}
                printf '::error title=Test shard infrastructure failure::%s exited with code %d without producing %s.\n' \
                  "$annotation_proj" "$exit_code" "$annotation_result_file"
                printf '| %s | FAIL | %d |\n' "$summary_proj" "$exit_code" >> "$GITHUB_STEP_SUMMARY"
                exit "$exit_code"
              fi
              status=FAIL
              failures=$((failures + 1))
              printf '::error title=Test shard failed::%s exited with code %d.\n' "$annotation_proj" "$exit_code"
            fi
            # A zero child exit is insufficient: require this invocation's nonzero TRX.
            # The heredoc also keeps the verifier from consuming the project-list stdin.
            if ! python3 - "$result_file" "$report_marker" "$exit_code" <<'PYTRX'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          try:
              report = pathlib.Path(sys.argv[1])
              if report.stat().st_mtime_ns < pathlib.Path(sys.argv[2]).stat().st_mtime_ns:
                  raise ValueError("stale report")
              root = ET.parse(report).getroot()
              ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
              if root.tag != ns + "TestRun":
                  raise ValueError("invalid TRX root")
              counters = root.find(f"{ns}ResultSummary/{ns}Counters")
              results = root.findall(f"{ns}Results/{ns}UnitTestResult")
              if counters is None:
                  raise ValueError("missing counters")
              total = int(counters.get("total", "-1"))
              executed = int(counters.get("executed", "-1"))
              outcomes = [result.get("outcome") for result in results]
              if total != len(results) or executed <= 0 or executed != sum(outcome != "NotExecuted" for outcome in outcomes):
                  raise ValueError("missing or inconsistent test results")
              if any(outcome not in {"Passed", "Failed", "NotExecuted"} for outcome in outcomes):
                  raise ValueError("invalid result outcome")
              summary = root.find(f"{ns}ResultSummary")
              if summary is None or summary.get("outcome") not in {"Completed", "Passed", "Failed"}:
                  raise ValueError("invalid result summary")
              for name, outcome in (("passed", "Passed"), ("failed", "Failed"), ("notExecuted", "NotExecuted")):
                  if name in counters.attrib and int(counters.get(name)) != outcomes.count(outcome):
                      raise ValueError("contradictory outcome counters")
              failures = [int(counters.get(name, "0")) for name in
                          ("failed", "error", "timeout", "aborted", "inconclusive", "passedButRunAborted", "notRunnable", "disconnected")]
              if any(value < 0 for value in failures):
                  raise ValueError("invalid failure counters")
              if int(sys.argv[3]) == 0 and ("Failed" in outcomes or summary.get("outcome") == "Failed" or any(failures)):
                  raise ValueError("failed summary or counters with successful exit")
          except (OSError, ValueError, ET.ParseError):
              print("Expected a fresh, valid TRX with nonzero executed test results.", file=sys.stderr)
              sys.exit(1)
          PYTRX
            then
              annotation_proj=${proj//%/%25}
              printf '::error title=Invalid test report::%s did not produce fresh nonzero test evidence.\n' "$annotation_proj"
              printf '| %s | FAIL | 1 |\n' "$summary_proj" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            printf '| %s | %s | %d |\n' "$summary_proj" "$status" "$exit_code" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$UNIT_TEST_PROJECTS"
          echo >> "$GITHUB_STEP_SUMMARY"
          printf 'failure-count=%d\n' "$failures" >> "$GITHUB_OUTPUT"
      - name: Unit tests (Tier 1, Microsoft.Testing.Platform)
        id: unit-tests-mtp
        if: ${{ inputs.unit-test-projects != '' && inputs.test-platform == 'microsoft-testing-platform' }}
        shell: bash
        env:
          UNIT_TEST_PROJECTS: ${{ inputs.unit-test-projects }}
          RUN_COVERAGE_GATE: ${{ inputs.run-coverage-gate }}
        run: |
          set -euo pipefail
          failures=0
          {
            echo "## Tier 1 Unit Tests (Microsoft.Testing.Platform)"
            echo
            echo "| Project | Status | Exit code |"
            echo "| --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            name=$(basename "$proj")
            result_file="TestResults/${name}/${name}.trx"
            rm -f -- "$result_file"
            mkdir -p "TestResults/${name}"
            report_marker="TestResults/${name}/.started"
            touch "$report_marker"
            summary_proj=${proj//\\/\\\\}
            summary_proj=${summary_proj//|/\\|}
            summary_proj=${summary_proj//\`/\\\`}
            coverage_args=()
            if [ "$RUN_COVERAGE_GATE" = "true" ]; then
              coverage_args+=(--coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml)
            fi
            if dotnet test "$proj" --no-build --configuration Release \
                --results-directory "TestResults/${name}" \
                --report-xunit-trx \
                --report-xunit-trx-filename "${name}.trx" \
                "${coverage_args[@]}" </dev/null; then
              status=PASS
              exit_code=0
            else
              exit_code=$?
              annotation_proj=${proj//%/%25}
              if [ "$exit_code" -eq 10 ]; then
                printf '::error title=Test shard infrastructure failure::%s exited with infrastructure code %d.\n' "$annotation_proj" "$exit_code"
                printf '| %s | FAIL | %d |\n' "$summary_proj" "$exit_code" >> "$GITHUB_STEP_SUMMARY"
                exit "$exit_code"
              fi
              if [ ! -f "$result_file" ]; then
                annotation_result_file=${result_file//%/%25}
                printf '::error title=Test shard infrastructure failure::%s exited with code %d without producing %s.\n' \
                  "$annotation_proj" "$exit_code" "$annotation_result_file"
                printf '| %s | FAIL | %d |\n' "$summary_proj" "$exit_code" >> "$GITHUB_STEP_SUMMARY"
                exit "$exit_code"
              fi
              status=FAIL
              failures=$((failures + 1))
              printf '::error title=Test shard failed::%s exited with code %d.\n' "$annotation_proj" "$exit_code"
            fi
            # A zero child exit is insufficient: require this invocation's nonzero TRX.
            # The heredoc also keeps the verifier from consuming the project-list stdin.
            if ! python3 - "$result_file" "$report_marker" "$exit_code" <<'PYTRX'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          try:
              report = pathlib.Path(sys.argv[1])
              if report.stat().st_mtime_ns < pathlib.Path(sys.argv[2]).stat().st_mtime_ns:
                  raise ValueError("stale report")
              root = ET.parse(report).getroot()
              ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
              if root.tag != ns + "TestRun":
                  raise ValueError("invalid TRX root")
              counters = root.find(f"{ns}ResultSummary/{ns}Counters")
              results = root.findall(f"{ns}Results/{ns}UnitTestResult")
              if counters is None:
                  raise ValueError("missing counters")
              total = int(counters.get("total", "-1"))
              executed = int(counters.get("executed", "-1"))
              outcomes = [result.get("outcome") for result in results]
              if total != len(results) or executed <= 0 or executed != sum(outcome != "NotExecuted" for outcome in outcomes):
                  raise ValueError("missing or inconsistent test results")
              if any(outcome not in {"Passed", "Failed", "NotExecuted"} for outcome in outcomes):
                  raise ValueError("invalid result outcome")
              summary = root.find(f"{ns}ResultSummary")
              if summary is None or summary.get("outcome") not in {"Completed", "Passed", "Failed"}:
                  raise ValueError("invalid result summary")
              for name, outcome in (("passed", "Passed"), ("failed", "Failed"), ("notExecuted", "NotExecuted")):
                  if name in counters.attrib and int(counters.get(name)) != outcomes.count(outcome):
                      raise ValueError("contradictory outcome counters")
              failures = [int(counters.get(name, "0")) for name in
                          ("failed", "error", "timeout", "aborted", "inconclusive", "passedButRunAborted", "notRunnable", "disconnected")]
              if any(value < 0 for value in failures):
                  raise ValueError("invalid failure counters")
              if int(sys.argv[3]) == 0 and ("Failed" in outcomes or summary.get("outcome") == "Failed" or any(failures)):
                  raise ValueError("failed summary or counters with successful exit")
          except (OSError, ValueError, ET.ParseError):
              print("Expected a fresh, valid TRX with nonzero executed test results.", file=sys.stderr)
              sys.exit(1)
          PYTRX
            then
              annotation_proj=${proj//%/%25}
              printf '::error title=Invalid test report::%s did not produce fresh nonzero test evidence.\n' "$annotation_proj"
              printf '| %s | FAIL | 1 |\n' "$summary_proj" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            printf '| %s | %s | %d |\n' "$summary_proj" "$status" "$exit_code" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$UNIT_TEST_PROJECTS"
          echo >> "$GITHUB_STEP_SUMMARY"
          printf 'failure-count=%d\n' "$failures" >> "$GITHUB_OUTPUT"
      - name: Require isolated success before integration
        id: isolated-gate
        shell: bash
        env:
          MODULE_MANIFEST: ${{ inputs.module-manifest }}
          INTEGRATION_PROFILES: ${{ inputs.integration-test-profiles }}
          LEGACY_INTEGRATION: ${{ inputs.integration-test-projects }}
          LEGACY_ASPIRE: ${{ inputs.aspire-test-project }}
          UNIT_PROJECTS: ${{ inputs.unit-test-projects }}
          UNIT_FAILURE_COUNT: ${{ inputs.test-platform == 'microsoft-testing-platform' && steps.unit-tests-mtp.outputs.failure-count || steps.unit-tests-vstest.outputs.failure-count }}
        run: |
          set -euo pipefail
          if [ -n "$LEGACY_INTEGRATION$LEGACY_ASPIRE" ]; then
            echo 'Direct integration and advisory AppHost testing are retired; declare package suites and pass module-manifest/integration-test-profiles.' >&2
            exit 1
          fi
          if [ -z "$MODULE_MANIFEST" ] || [ -z "${INTEGRATION_PROFILES//[[:space:]]/}" ] || [ -z "${UNIT_PROJECTS//[[:space:]]/}" ] || [ "$UNIT_FAILURE_COUNT" != 0 ]; then
            echo 'Declared package integration requires nonempty suites and successful isolated tests before provisioning.' >&2
            exit 1
          fi
      - name: Install integration toolchain without starting services
        if: ${{ inputs.module-manifest != '' && steps.isolated-gate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('.hexalith/builds-execution/Props/Directory.Packages.props').getroot()
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              for key, element in [('CI_ASPIRE_VERSION', 'HexalithAspireAppHostSdkVersion'), ('CI_DAPR_CLI_VERSION', 'HexalithDaprCliVersion'), ('CI_DAPR_RUNTIME_VERSION', 'HexalithDaprRuntimeVersion')]:
                  value = root.find('.//' + element).text
                  if not value or any(c not in '0123456789.-abcdefghijklmnopqrstuvwxyz' for c in value):
                      raise ValueError('invalid workflow-owned toolchain version')
                  stream.write(key + '=' + value + '\n')
          PYTHON
      - name: Prepare integration binaries
        if: ${{ inputs.module-manifest != '' && steps.isolated-gate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/hexalith-ci-tools"
          dapr_home="$RUNNER_TEMP/hexalith-ci-dapr"
          mkdir -p "$tools" "$dapr_home/tools" "$dapr_home/.dapr/bin"
          dotnet tool install --tool-path "$tools" Aspire.Cli --version "$CI_ASPIRE_VERSION"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "https://github.com/dapr/cli/releases/download/v$CI_DAPR_CLI_VERSION/dapr_linux_amd64.tar.gz" -o "$RUNNER_TEMP/dapr-cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/dapr-cli.tar.gz" -C "$dapr_home/tools" dapr
          for binary in daprd placement scheduler; do
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "https://github.com/dapr/dapr/releases/download/v$CI_DAPR_RUNTIME_VERSION/${binary}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/$binary.tar.gz"
            tar -xzf "$RUNNER_TEMP/$binary.tar.gz" -C "$dapr_home/.dapr/bin" "$binary"
          done
          echo "$tools" >> "$GITHUB_PATH"
          echo "HEXALITH_DAPR_HOME=$dapr_home" >> "$GITHUB_ENV"
      - name: Authenticate pull-only integration registry
        id: registry-login
        if: ${{ inputs.module-manifest != '' && steps.isolated-gate.outcome == 'success' }}
        shell: bash
        env:
          REGISTRY_PULL_USERNAME: ${{ secrets.registry-pull-username }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.registry-pull-password }}
        run: |
          set -euo pipefail
          if [[ -z "$REGISTRY_PULL_USERNAME" || -z "$REGISTRY_PULL_PASSWORD" ]]; then
            echo '::error::Dedicated pull-only registry credentials are required.'
            exit 1
          fi
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          config="$(mktemp -d "$runner_temp/hexalith-ci-registry.XXXXXX")"
          trap 'status=$?; if [ "$status" -ne 0 ]; then rm -rf -- "$config"; fi; exit "$status"' EXIT
          chmod 700 "$config"
          export DOCKER_CONFIG="$config"
          printf '%s\n' "DOCKER_CONFIG=$config" "HEXALITH_CI_REGISTRY_CONFIG=$config" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_PULL_PASSWORD" | docker login registry.hexalith.com --username="$REGISTRY_PULL_USERNAME" --password-stdin
      - name: Runner-owned package integration
        if: ${{ inputs.module-manifest != '' && steps.isolated-gate.outcome == 'success' && steps.registry-login.outcome == 'success' }}
        shell: bash
        env:
          MODULE_MANIFEST: ${{ inputs.module-manifest }}
          INTEGRATION_PROFILES: ${{ inputs.integration-test-profiles }}
        run: |
          python3 .hexalith/builds-execution/Github/run-module-integration/run_module_integration.py run --manifest "$MODULE_MANIFEST" --profiles "$INTEGRATION_PROFILES" --receipt "$RUNNER_TEMP/hexalith-ci-owner.json" --evidence TestResults/module-integration
      - name: Finalize exact CI owner
        if: ${{ always() && inputs.module-manifest != '' }}
        timeout-minutes: 4
        shell: bash
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 .hexalith/builds-execution/Github/run-module-integration/run_module_integration.py finalize --receipt "$RUNNER_TEMP/hexalith-ci-owner.json" --evidence TestResults/module-integration --job-status "$CI_JOB_STATUS"
      - name: Remove integration registry credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          config="${HEXALITH_CI_REGISTRY_CONFIG:-}"
          if [[ -z "$config" ]]; then exit 0; fi
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          if [[ "$(dirname -- "$config")" != "$runner_temp" || "$(basename -- "$config")" != hexalith-ci-registry.* || -L "$config" ]]; then
            echo '::error::Refusing to remove a foreign registry credential directory.'
            exit 1
          fi
          rm -rf -- "$config"
          [[ ! -e "$config" && ! -L "$config" ]]
      - name: Upload classified integration diagnostics
        if: ${{ always() && inputs.module-manifest != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-integration-diagnostics
          path: TestResults/module-integration
          retention-days: 7
      - name: Validate coverage gates
        if: ${{ inputs.run-coverage-gate }}
        shell: bash
        env:
          COVERAGE_ISOLATION_TARGETS: ${{ inputs.coverage-isolation-targets }}
          COVERAGE_LINE_SCOPE: ${{ inputs.coverage-line-scope }}
          COVERAGE_MINIMUM_LINE: ${{ inputs.coverage-minimum-line }}
          COVERAGE_REQUIRED_BRANCH: ${{ inputs.coverage-required-branch }}
        run: |
          set -euo pipefail
          args=(--coverage-root TestResults
                --minimum-line-coverage "$COVERAGE_MINIMUM_LINE"
                --required-branch-coverage "$COVERAGE_REQUIRED_BRANCH")
          while IFS= read -r tgt; do
            [ -z "$tgt" ] && continue
            args+=(--isolation-auth-target "$tgt")
          done <<< "$COVERAGE_ISOLATION_TARGETS"
          while IFS= read -r prefix; do
            [ -z "$prefix" ] && continue
            args+=(--line-scope "$prefix")
          done <<< "$COVERAGE_LINE_SCOPE"
          python3 scripts/validate-coverage.py "${args[@]}" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Fail on blocking test failures
        if: always()
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test-platform }}
          UNIT_TEST_PROJECTS: ${{ inputs.unit-test-projects }}
          UNIT_VSTEST_FAILURE_COUNT: ${{ steps.unit-tests-vstest.outputs.failure-count }}
          UNIT_MTP_FAILURE_COUNT: ${{ steps.unit-tests-mtp.outputs.failure-count }}
        run: |
          set -euo pipefail
          if [ "$TEST_PLATFORM" = "vstest" ]; then
            if [ -n "$UNIT_TEST_PROJECTS" ] && [ -z "$UNIT_VSTEST_FAILURE_COUNT" ]; then
              echo '::error title=Missing test shard output::Tier 1 VSTest did not report a failure count.'
              exit 1
            fi
          elif [ "$TEST_PLATFORM" = "microsoft-testing-platform" ]; then
            if [ -n "$UNIT_TEST_PROJECTS" ] && [ -z "$UNIT_MTP_FAILURE_COUNT" ]; then
              echo '::error title=Missing test shard output::Tier 1 Microsoft.Testing.Platform did not report a failure count.'
              exit 1
            fi
          fi

          total_failures=0
          for failure_count in \
            "$UNIT_VSTEST_FAILURE_COUNT" \
            "$UNIT_MTP_FAILURE_COUNT"; do
            [ -z "$failure_count" ] && continue
            if [[ ! "$failure_count" =~ ^[0-9]+$ ]]; then
              printf '::error title=Invalid test shard output::Expected a numeric failure count, received %s.\n' "$failure_count"
              exit 1
            fi
            total_failures=$((total_failures + 10#$failure_count))
          done

          if [ "$total_failures" -ne 0 ]; then
            printf '::error title=Blocking test failures::%d test project(s) failed across the blocking tiers.\n' "$total_failures"
            exit 1
          fi
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocking-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 7
