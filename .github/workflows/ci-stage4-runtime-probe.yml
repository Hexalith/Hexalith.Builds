name: Temporary stage 4 runtime probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI_MODULE_ROOT: stage4-probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: python3 Tools/ci/stage4_runtime_probe.py prepare
      - uses: $/Github/ci-environment
        with:
          solution: stage4-probe/Probe.slnx
          dapr: 'true'
          browsers: 'true'
          registry: 'true'
        env:
          REGISTRY_PULL_USERNAME: ${{ secrets.HEXALITH_REGISTRY_PULL_USERNAME }}
          REGISTRY_PULL_PASSWORD: ${{ secrets.HEXALITH_REGISTRY_PULL_PASSWORD }}
      - uses: ./.github/actions/after-unit-tests
      - uses: ./.github/actions/after-integration-tests
