name: CI

# Validate the shared actions, reusable workflows, and PowerShell/Python tooling
# consumed by Hexalith modules.
# Shared release consumes successful CI for the exact source revision, then
# produces the audited original release artifact once.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  # PRs may supersede validation of the same ref. Preserve exact-source push
  # and manual runs for release even when a later main commit arrives.
  group: builds-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  dotnet:
    name: .NET tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      # Active projects use SDK 11; SDK 10 supplies offline backward-compatibility fixtures.
      additional-sdk-version: '10.0.404'
    secrets:
      registry-pull-username: ${{ secrets.HEXALITH_REGISTRY_PULL_USERNAME }}
      registry-pull-password: ${{ secrets.HEXALITH_REGISTRY_PULL_PASSWORD }}

  sample:
    name: Sample module
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      module-root: Samples/Hexalith.Sample
      expected-source: Samples/Hexalith.Sample/expected-source

  sample-windows:
    name: Sample Windows tests
    needs: sample
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Prepare module
        uses: $/Github/prepare
        with:
          solution: ${{ needs.sample.outputs.solution }}
          submodules: ${{ needs.sample.outputs.submodules }}
          global-json: ${{ needs.sample.outputs.global-json }}

      - name: Run module action
        uses: ./.github/actions/sample-windows

  catalog:
    runs-on: ubuntu-latest
    name: Package catalog contracts
    # Include the complete audit regressions and isolated tooling rebuilds.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Initialize .NET
        uses: ./Github/initialize-dotnet
        with:
          global-json-file: global.json

      - name: Install .NET 10 targeting packs for offline catalog fixtures
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'

      - name: Validate central package versions
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/validate-central-package-versions.ps1

      - name: Test authoritative package catalog
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-authoritative-package-catalog.ps1

      - name: Test logging generator selection
        run: python3 Tools/test-logging-generator-selection.py

      - name: Test central package version validator
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-central-package-version-validator.ps1

      - name: Validate package version audit
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/validate-package-version-audit.ps1

      - name: Test package version audit generator
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-package-version-audit-generator.ps1

      - name: Test package version audit validator
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-package-version-audit-validator.ps1

      - name: Validate Builds consumer package authority
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/validate-consumer-package-authority.ps1 -RepositoryRoot . -CatalogPath ./Props/Directory.Packages.props

      - name: Test consumer package authority validator
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-consumer-package-authority-validator.ps1

      - name: Validate package version exception inventory
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/validate-package-version-exceptions.ps1 -InventoryPath ./Tools/package-version-exceptions.json -CatalogPath ./Props/Directory.Packages.props

      - name: Test package version exception validator
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-package-version-exception-validator.ps1

      - name: Validate Platform version catalog and hosting compatibility
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/validate-platform-version-catalog.ps1

      - name: Test Platform version catalog contracts
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-platform-version-catalog.ps1

      - name: Validate Dapr package versions
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/validate-dapr-package-versions.ps1

      - name: Test Dapr package validator
        shell: pwsh
        run: pwsh -NoProfile -File ./Tools/test-dapr-package-version-validator.ps1

  quality:
    name: Workflow lint and public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Lint workflows and composite actions with online audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/ci/lint_workflows.py --export-path

      - name: Check public API against the reachable stable release
        run: uv run --no-cache --locked --script --python 3.12 Tools/ci/check_public_api.py

  python-tests:
    runs-on: ubuntu-latest
    name: Python contract tests (${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', 'runner']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Capture runner Python before setup
        run: python3 Tools/ci/capture_python.py

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Initialize .NET SDK
        uses: ./Github/initialize-dotnet
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Verify npm dependency provenance and signatures
        run: npm audit signatures

      - name: Install integrity-checked CI tools
        run: python Tools/ci/lint_workflows.py --install-only --export-path

      - name: Run the shared Python suite and CI and perimeter contract validators
        env:
          CI_PYTHON: ${{ matrix.python == 'runner' && env.RUNNER_PYTHON || '3.12' }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-cache --locked --script --python "$CI_PYTHON" Tools/ci/run_python_tests.py
