name: Hexalith Domain CI

on:
  workflow_call:
    inputs:
      solution:
        description: 'Path to the .slnx/.sln solution to restore and build.'
        required: true
        type: string
      dotnet-global-json:
        description: 'Path to global.json pinning the .NET SDK.'
        required: false
        type: string
        default: 'global.json'
      packages-lock-file:
        description: >-
          Comma-separated hashFiles() patterns for the NuGet cache key. The default
          covers the module package props, global.json, and the shared package props
          imported from the Hexalith.Builds submodule; patterns that match nothing
          are simply ignored.
        required: false
        type: string
        default: 'Directory.Packages.props, global.json, references/Hexalith.Builds/Props/Directory.Packages.props'
      dapr-version:
        description: 'Dapr version for integration/aspire tiers.'
        required: false
        type: string
        default: '1.18.0'
      test-platform:
        description: >-
          Test command contract: vstest uses --logger/--collect; microsoft-testing-platform
          uses the xUnit v3 MTP reporter and trait-filter options.
        required: false
        type: string
        default: 'vstest'
      unit-test-projects:
        description: 'Newline-separated Tier 1 test project paths (no Dapr).'
        required: false
        type: string
        default: ''
      integration-test-projects:
        description: 'Newline-separated Tier 2 test project paths (require Dapr).'
        required: false
        type: string
        default: ''
      aspire-test-project:
        description: 'Tier 3 Aspire test project path. When set, enables the aspire and performance jobs.'
        required: false
        type: string
        default: ''
      aspire-non-performance-filter:
        description: 'dotnet test --filter for the non-performance Aspire tier.'
        required: false
        type: string
        default: 'Category!=Performance'
      performance-filter:
        description: 'dotnet test --filter for the nightly performance tier.'
        required: false
        type: string
        default: 'Category=Performance'
      aspire-mtp-excluded-trait:
        description: 'Microsoft.Testing.Platform trait excluded from the non-performance Aspire tier.'
        required: false
        type: string
        default: 'Category=Performance'
      performance-mtp-trait:
        description: 'Microsoft.Testing.Platform trait selected by the nightly performance tier.'
        required: false
        type: string
        default: 'Category=Performance'
      run-consumer-validation:
        description: 'Run scripts/pack + validate-nuget + validate-consumer package checks.'
        required: false
        type: boolean
        default: false
      run-coverage-gate:
        description: 'Run scripts/validate-coverage.py over TestResults.'
        required: false
        type: boolean
        default: false
      coverage-minimum-line:
        description: 'Minimum line coverage percentage.'
        required: false
        type: number
        default: 80
      coverage-required-branch:
        description: 'Required branch coverage percentage.'
        required: false
        type: number
        default: 100
      coverage-isolation-targets:
        description: 'Newline-separated files passed as --isolation-auth-target.'
        required: false
        type: string
        default: ''
      coverage-line-scope:
        description: >-
          Newline-separated source path prefixes passed as --line-scope to
          scripts/validate-coverage.py (the production projects the line gate is
          scoped to). When empty, the script falls back to its built-in default.
        required: false
        type: string
        default: ''
      aspire-continue-on-error:
        description: 'Whether the Aspire tier is non-blocking.'
        required: false
        type: boolean
        default: true
      build-timeout-minutes:
        required: false
        type: number
        default: 15
      aspire-timeout-minutes:
        required: false
        type: number
        default: 10
      performance-timeout-minutes:
        required: false
        type: number
        default: 60
      governed-ci:
        description: >-
          Opt into the BUILD-REL-1 / GOV-1 governed CI contract: validate the actual
          reusable-workflow identity, evaluate the bounded static workflow/composite
          closure, and emit the provenance the caller needs for its
          hexalith.dependency-release-handoff.v1 artifact. Leave unset to keep the
          pre-BUILD-REL-1 CI contract exactly.
        required: false
        type: boolean
        default: false
      builds-execution-sha:
        description: 'Exact approved Hexalith.Builds commit resolved for this reusable workflow. Required in governed mode.'
        required: false
        type: string
        default: ''
      candidate-commit:
        description: 'Exact candidate commit the governed CI run evaluates. Required in governed mode.'
        required: false
        type: string
        default: ''
      dependency-policy-repository:
        description: 'Normalized github.com/owner/repository identity owning the active dependency policy.'
        required: false
        type: string
        default: ''
      dependency-policy-path:
        description: 'Repository-relative path of the active dependency policy.'
        required: false
        type: string
        default: ''
      dependency-policy-commit:
        description: 'Exact commit of the active dependency policy.'
        required: false
        type: string
        default: ''
      dependency-policy-sha256:
        description: 'Exact SHA-256 of the active dependency-policy bytes.'
        required: false
        type: string
        default: ''
      expected-ci-evaluator-digest:
        description: 'Expected CI evaluator-authorization digest recorded into the governed provenance.'
        required: false
        type: string
        default: ''
    outputs:
      governed-candidate:
        description: 'Exact candidate commit the governed CI run evaluated.'
        value: ${{ jobs.build-and-test.outputs.governed-candidate }}
      governed-provenance-json:
        description: 'Complete governed-provenance document as compact canonical JSON.'
        value: ${{ jobs.build-and-test.outputs.governed-provenance-json }}
      governed-provenance-sha256:
        description: 'SHA-256 of the emitted governed-provenance document bytes.'
        value: ${{ jobs.build-and-test.outputs.governed-provenance-sha256 }}
      governed-closure-digest:
        description: 'Canonical digest of the evaluated governed reusable/composite closure.'
        value: ${{ jobs.build-and-test.outputs.governed-closure-digest }}
      governed-reusable-repository:
        description: 'Normalized identity of the repository owning the governed reusable workflow.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-repository }}
      governed-reusable-workflow-path:
        description: 'Repository-relative path of the governed reusable workflow.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-workflow-path }}
      governed-reusable-commit:
        description: 'Exact commit the governed reusable workflow executed from.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-commit }}
      governed-reusable-blob-sha256:
        description: 'SHA-256 of the governed domain-ci.yml blob that executed.'
        value: ${{ jobs.build-and-test.outputs.governed-reusable-blob-sha256 }}
      governed-actions-json:
        description: 'Canonical JSON array of the local composite-action sources in the governed closure.'
        value: ${{ jobs.build-and-test.outputs.governed-actions-json }}
      governed-external-actions-json:
        description: 'Canonical JSON array of the pinned external action coordinates in the governed closure.'
        value: ${{ jobs.build-and-test.outputs.governed-external-actions-json }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    outputs:
      governed-candidate: ${{ steps.governed-provenance.outputs.candidate }}
      governed-provenance-json: ${{ steps.governed-provenance.outputs.provenance-json }}
      governed-provenance-sha256: ${{ steps.governed-provenance.outputs.provenance-sha256 }}
      governed-closure-digest: ${{ steps.governed-provenance.outputs.closure-digest }}
      governed-reusable-repository: ${{ steps.governed-provenance.outputs.reusable-repository }}
      governed-reusable-workflow-path: ${{ steps.governed-provenance.outputs.reusable-workflow-path }}
      governed-reusable-commit: ${{ steps.governed-provenance.outputs.reusable-commit }}
      governed-reusable-blob-sha256: ${{ steps.governed-provenance.outputs.reusable-blob-sha256 }}
      governed-actions-json: ${{ steps.governed-provenance.outputs.actions-json }}
      governed-external-actions-json: ${{ steps.governed-provenance.outputs.external-actions-json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
      - name: Validate governed CI contract
        if: ${{ inputs.governed-ci }}
        shell: bash
        env:
          BUILDS_EXECUTION_SHA: ${{ inputs.builds-execution-sha }}
          CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          POLICY_REPOSITORY: ${{ inputs.dependency-policy-repository }}
          POLICY_PATH: ${{ inputs.dependency-policy-path }}
          POLICY_COMMIT: ${{ inputs.dependency-policy-commit }}
          POLICY_SHA256: ${{ inputs.dependency-policy-sha256 }}
          EXPECTED_EVALUATOR_DIGEST: ${{ inputs.expected-ci-evaluator-digest }}
          RESOLVED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RESOLVED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          RESOLVED_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          failures=0
          reject() {
            echo "$1" >&2
            failures=$((failures + 1))
          }

          if [[ ! "$BUILDS_EXECUTION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            reject "governed CI requires builds-execution-sha to be an exact lowercase 40-character commit SHA."
          fi
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            reject "governed CI requires candidate-commit to be an exact lowercase 40-character commit SHA."
          fi
          if [[ ! "$POLICY_REPOSITORY" =~ ^github\.com/[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            reject "governed CI requires dependency-policy-repository as a normalized github.com/owner/repository identity."
          fi
          if [ -z "${POLICY_PATH//[[:space:]]/}" ] || [[ "$POLICY_PATH" == /* ]]; then
            reject "governed CI requires dependency-policy-path as a non-empty relative path."
          fi
          if [[ ! "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            reject "governed CI requires dependency-policy-commit to be an exact lowercase 40-character commit SHA."
          fi
          if [[ ! "$POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            reject "governed CI requires dependency-policy-sha256 to be an exact lowercase 64-character SHA-256."
          fi
          if [[ ! "$EXPECTED_EVALUATOR_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            reject "governed CI requires expected-ci-evaluator-digest to be an exact lowercase 64-character SHA-256."
          fi
          if [ "$RESOLVED_WORKFLOW_REPOSITORY" != "Hexalith/Hexalith.Builds" ]; then
            reject "The governed CI job is not defined by the approved Hexalith.Builds repository."
          fi
          if [ "$RESOLVED_WORKFLOW_SHA" != "$BUILDS_EXECUTION_SHA" ]; then
            reject "Resolved reusable-workflow SHA does not match the approved builds-execution-sha."
          fi
          if [[ "$RESOLVED_WORKFLOW_REF" != Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@* ]]; then
            reject "Resolved job.workflow_ref does not name Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml."
          fi
          if [ "$CANDIDATE_COMMIT" != "$EVENT_HEAD_SHA" ]; then
            reject "governed CI candidate-commit must be the exact commit this CI run evaluates."
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$CANDIDATE_COMMIT" ]; then
            reject "The checked-out CI source does not match the declared exact candidate."
          fi

          if [ "$failures" -ne 0 ]; then
            echo "Rejected $failures governed CI contract violation(s)." >&2
            exit 1
          fi
      - name: Checkout approved Builds actions
        if: ${{ inputs.governed-ci }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: ${{ inputs.builds-execution-sha }}
          path: .hexalith/builds-execution
          persist-credentials: false
      - name: Evaluate governed workflow provenance
        id: governed-provenance
        if: ${{ inputs.governed-ci }}
        uses: ./.hexalith/builds-execution/Github/governed-provenance
        with:
          stage: ci
          builds-execution-sha: ${{ inputs.builds-execution-sha }}
          workflow-path: .github/workflows/domain-ci.yml
          candidate: ${{ inputs.candidate-commit }}
          dependency-policy-repository: ${{ inputs.dependency-policy-repository }}
          dependency-policy-path: ${{ inputs.dependency-policy-path }}
          dependency-policy-commit: ${{ inputs.dependency-policy-commit }}
          dependency-policy-sha256: ${{ inputs.dependency-policy-sha256 }}
          expected-evaluator-digest: ${{ inputs.expected-ci-evaluator-digest }}
          output: .hexalith/ci/governed/ci-workflow-provenance.json
      # Two forms of the same composite. Governed mode must load Builds-owned composites
      # from the reusable-workflow commit itself, which only the governed checkout above
      # provides; a legacy caller never checks Builds out, so it consumes the pinned copy.
      - name: Initialize root-declared submodules (governed)
        if: ${{ inputs.governed-ci }}
        uses: ./.hexalith/builds-execution/Github/initialize-build
      - name: Initialize root-declared submodules
        if: ${{ !inputs.governed-ci }}
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@99d5a46c3d0db007b2d2f9c5e277a7d2c32b9a38 # BUILD-REL-1
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.dotnet-global-json }}
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles(inputs.packages-lock-file) }}
          restore-keys: nuget-
      - name: Validate test platform input
        if: ${{ inputs.test-platform != 'vstest' && inputs.test-platform != 'microsoft-testing-platform' }}
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test-platform }}
        run: |
          echo "Unsupported test-platform '$TEST_PLATFORM'. Expected vstest or microsoft-testing-platform." >&2
          exit 1
      - name: Validate Microsoft.Testing.Platform coverage support
        if: ${{ inputs.test-platform == 'microsoft-testing-platform' && inputs.run-coverage-gate }}
        shell: bash
        run: |
          echo "run-coverage-gate is not supported with microsoft-testing-platform until an MTP coverage extension is configured." >&2
          exit 1
      - name: Restore
        env:
          SOLUTION: ${{ inputs.solution }}
        run: dotnet restore "$SOLUTION"
      - name: Build
        env:
          SOLUTION: ${{ inputs.solution }}
        run: dotnet build "$SOLUTION" --no-restore --configuration Release -warnaserror
      - name: Validate package consumer references
        if: ${{ inputs.run-consumer-validation }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./nupkgs
          python3 scripts/pack-release-packages.py ./nupkgs 0.0.0-ci-test
          python3 scripts/validate-nuget-packages.py ./nupkgs
          python3 scripts/validate-consumer-package-references.py ./nupkgs
      - name: Unit tests (Tier 1, VSTest)
        if: ${{ inputs.unit-test-projects != '' && inputs.test-platform == 'vstest' }}
        shell: bash
        env:
          UNIT_TEST_PROJECTS: ${{ inputs.unit-test-projects }}
        run: |
          set -euo pipefail
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            name=$(basename "$proj")
            dotnet test "$proj" --no-build --configuration Release \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory "TestResults/${name}" \
              --collect:"XPlat Code Coverage"
          done <<< "$UNIT_TEST_PROJECTS"
      - name: Unit tests (Tier 1, Microsoft.Testing.Platform)
        if: ${{ inputs.unit-test-projects != '' && inputs.test-platform == 'microsoft-testing-platform' }}
        shell: bash
        env:
          UNIT_TEST_PROJECTS: ${{ inputs.unit-test-projects }}
        run: |
          set -euo pipefail
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            name=$(basename "$proj")
            dotnet test "$proj" --no-build --configuration Release \
              --results-directory "TestResults/${name}" \
              --report-xunit-trx \
              --report-xunit-trx-filename "${name}.trx"
          done <<< "$UNIT_TEST_PROJECTS"
      - name: Install and initialize Dapr (governed)
        if: ${{ inputs.integration-test-projects != '' && inputs.governed-ci }}
        uses: ./.hexalith/builds-execution/Github/dapr-init
        with:
          version: ${{ inputs.dapr-version }}
      - name: Install and initialize Dapr
        if: ${{ inputs.integration-test-projects != '' && !inputs.governed-ci }}
        uses: Hexalith/Hexalith.Builds/Github/dapr-init@99d5a46c3d0db007b2d2f9c5e277a7d2c32b9a38 # BUILD-REL-1
        with:
          version: ${{ inputs.dapr-version }}
      - name: Integration tests (Tier 2, VSTest)
        if: ${{ inputs.integration-test-projects != '' && inputs.test-platform == 'vstest' }}
        shell: bash
        env:
          INTEGRATION_TEST_PROJECTS: ${{ inputs.integration-test-projects }}
        run: |
          set -euo pipefail
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            name=$(basename "$proj")
            dotnet test "$proj" --no-build --configuration Release \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory "TestResults/${name}" \
              --collect:"XPlat Code Coverage"
          done <<< "$INTEGRATION_TEST_PROJECTS"
      - name: Integration tests (Tier 2, Microsoft.Testing.Platform)
        if: ${{ inputs.integration-test-projects != '' && inputs.test-platform == 'microsoft-testing-platform' }}
        shell: bash
        env:
          INTEGRATION_TEST_PROJECTS: ${{ inputs.integration-test-projects }}
        run: |
          set -euo pipefail
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            name=$(basename "$proj")
            dotnet test "$proj" --no-build --configuration Release \
              --results-directory "TestResults/${name}" \
              --report-xunit-trx \
              --report-xunit-trx-filename "${name}.trx"
          done <<< "$INTEGRATION_TEST_PROJECTS"
      - name: Validate coverage gates
        if: ${{ inputs.run-coverage-gate }}
        shell: bash
        env:
          COVERAGE_ISOLATION_TARGETS: ${{ inputs.coverage-isolation-targets }}
          COVERAGE_LINE_SCOPE: ${{ inputs.coverage-line-scope }}
          COVERAGE_MINIMUM_LINE: ${{ inputs.coverage-minimum-line }}
          COVERAGE_REQUIRED_BRANCH: ${{ inputs.coverage-required-branch }}
        run: |
          set -euo pipefail
          args=(--coverage-root TestResults
                --minimum-line-coverage "$COVERAGE_MINIMUM_LINE"
                --required-branch-coverage "$COVERAGE_REQUIRED_BRANCH")
          while IFS= read -r tgt; do
            [ -z "$tgt" ] && continue
            args+=(--isolation-auth-target "$tgt")
          done <<< "$COVERAGE_ISOLATION_TARGETS"
          while IFS= read -r prefix; do
            [ -z "$prefix" ] && continue
            args+=(--line-scope "$prefix")
          done <<< "$COVERAGE_LINE_SCOPE"
          python3 scripts/validate-coverage.py "${args[@]}" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blocking-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 7

  aspire-tests:
    if: ${{ inputs.aspire-test-project != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.aspire-timeout-minutes }}
    needs: build-and-test
    continue-on-error: ${{ inputs.aspire-continue-on-error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@99d5a46c3d0db007b2d2f9c5e277a7d2c32b9a38 # BUILD-REL-1
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.dotnet-global-json }}
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles(inputs.packages-lock-file) }}
          restore-keys: nuget-
      - name: Restore and Build
        env:
          SOLUTION: ${{ inputs.solution }}
        run: |
          dotnet restore "$SOLUTION"
          dotnet build "$SOLUTION" --no-restore --configuration Release -warnaserror
      - name: Install and initialize Dapr
        uses: Hexalith/Hexalith.Builds/Github/dapr-init@99d5a46c3d0db007b2d2f9c5e277a7d2c32b9a38 # BUILD-REL-1
        with:
          version: ${{ inputs.dapr-version }}
      # Coverage is not collected here: this tier is advisory (non-blocking by
      # default) and its coverage is intentionally excluded from the gates.
      - name: Aspire contract tests (Tier 3, non-Performance, VSTest)
        if: ${{ inputs.test-platform == 'vstest' }}
        shell: bash
        env:
          ASPIRE_TEST_PROJECT: ${{ inputs.aspire-test-project }}
          ASPIRE_NON_PERFORMANCE_FILTER: ${{ inputs.aspire-non-performance-filter }}
        run: >
          dotnet test "$ASPIRE_TEST_PROJECT"
          --no-build --configuration Release
          --filter "$ASPIRE_NON_PERFORMANCE_FILTER"
          --logger "trx;LogFileName=aspire-results.trx"
          --results-directory TestResults/aspire
      - name: Aspire contract tests (Tier 3, non-Performance, Microsoft.Testing.Platform)
        if: ${{ inputs.test-platform == 'microsoft-testing-platform' }}
        shell: bash
        env:
          ASPIRE_TEST_PROJECT: ${{ inputs.aspire-test-project }}
          ASPIRE_MTP_EXCLUDED_TRAIT: ${{ inputs.aspire-mtp-excluded-trait }}
        run: >
          dotnet test "$ASPIRE_TEST_PROJECT"
          --no-build --configuration Release
          --filter-not-trait "$ASPIRE_MTP_EXCLUDED_TRAIT"
          --results-directory TestResults/aspire
          --report-xunit-trx
          --report-xunit-trx-filename aspire-results.trx
      - name: Test summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Tier 3 Aspire Contract Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aspire-test-results
          path: "TestResults/**/*.trx"
          retention-days: 7

  performance-tests:
    if: ${{ inputs.aspire-test-project != '' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.performance-timeout-minutes }}
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@99d5a46c3d0db007b2d2f9c5e277a7d2c32b9a38 # BUILD-REL-1
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.dotnet-global-json }}
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles(inputs.packages-lock-file) }}
          restore-keys: nuget-
      - name: Restore and Build
        env:
          SOLUTION: ${{ inputs.solution }}
        run: |
          dotnet restore "$SOLUTION"
          dotnet build "$SOLUTION" --no-restore --configuration Release -warnaserror
      - name: Install and initialize Dapr
        uses: Hexalith/Hexalith.Builds/Github/dapr-init@99d5a46c3d0db007b2d2f9c5e277a7d2c32b9a38 # BUILD-REL-1
        with:
          version: ${{ inputs.dapr-version }}
      - name: Performance tests (Tier 3, nightly only, VSTest)
        if: ${{ inputs.test-platform == 'vstest' }}
        id: performance-tests-vstest
        shell: bash
        env:
          HEXALITH_EVENTSTORE_RUN_PERFORMANCE_TESTS: '1'
          HEXALITH_TENANTS_RUN_PERFORMANCE_TESTS: '1'
          ASPIRE_TEST_PROJECT: ${{ inputs.aspire-test-project }}
          PERFORMANCE_FILTER: ${{ inputs.performance-filter }}
        run: |
          set -euo pipefail
          rm -rf TestResults/performance
          mkdir -p TestResults/performance
          dotnet test "$ASPIRE_TEST_PROJECT" \
            --no-build --configuration Release \
            --filter "$PERFORMANCE_FILTER" \
            --logger "trx;LogFileName=perf-results.trx" \
            --results-directory TestResults/performance
      - name: Performance tests (Tier 3, nightly only, Microsoft.Testing.Platform)
        if: ${{ inputs.test-platform == 'microsoft-testing-platform' }}
        id: performance-tests-mtp
        shell: bash
        env:
          HEXALITH_EVENTSTORE_RUN_PERFORMANCE_TESTS: '1'
          HEXALITH_TENANTS_RUN_PERFORMANCE_TESTS: '1'
          ASPIRE_TEST_PROJECT: ${{ inputs.aspire-test-project }}
          PERFORMANCE_MTP_TRAIT: ${{ inputs.performance-mtp-trait }}
        run: |
          set -euo pipefail
          rm -rf TestResults/performance
          mkdir -p TestResults/performance
          dotnet test "$ASPIRE_TEST_PROJECT" \
            --no-build --configuration Release \
            --filter-trait "$PERFORMANCE_MTP_TRAIT" \
            --results-directory TestResults/performance \
            --report-xunit-trx \
            --report-xunit-trx-filename perf-results.trx
      - name: Validate performance test execution
        if: always()
        shell: bash
        env:
          PERFORMANCE_FILTER: ${{ inputs.test-platform == 'microsoft-testing-platform' && inputs.performance-mtp-trait || inputs.performance-filter }}
          PERFORMANCE_TEST_STEP_OUTCOME: ${{ inputs.test-platform == 'microsoft-testing-platform' && steps.performance-tests-mtp.outcome || steps.performance-tests-vstest.outcome }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          evidence_directory = Path("TestResults/performance")
          trx_path = evidence_directory / "perf-results.trx"
          summary_path = evidence_directory / "performance-test-summary.json"
          evidence_directory.mkdir(parents=True, exist_ok=True)

          summary = {
              "schemaVersion": 1,
              "generatedAtUtc": datetime.datetime.now(datetime.UTC).isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "commitSha": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "filter": os.environ.get("PERFORMANCE_FILTER", ""),
              "testStepOutcome": os.environ.get("PERFORMANCE_TEST_STEP_OUTCOME", ""),
              "trxPath": str(trx_path),
              "status": "unknown",
              "counts": {
                  "total": None,
                  "executed": None,
                  "passed": None,
                  "failed": None,
                  "skipped": None,
              },
          }

          def local_name(element):
              return element.tag.rsplit("}", 1)[-1]

          def write_evidence():
              summary_path.write_text(
                  json.dumps(summary, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if github_summary:
                  counts = summary["counts"]
                  with Path(github_summary).open("a", encoding="utf-8") as stream:
                      stream.write("## Scheduled Performance Tests\n\n")
                      stream.write(f"- Status: `{summary['status']}`\n")
                      stream.write(f"- Test step: `{summary['testStepOutcome']}`\n")
                      stream.write(f"- Filter: `{summary['filter']}`\n")
                      stream.write(f"- TRX: `{summary['trxPath']}`\n")
                      stream.write(
                          "- Counts: "
                          f"total={counts['total']}, executed={counts['executed']}, "
                          f"passed={counts['passed']}, failed={counts['failed']}, "
                          f"skipped={counts['skipped']}\n\n"
                      )

          if not trx_path.is_file():
              summary["status"] = "missing-trx"
              write_evidence()
              print(
                  f"::error title=Missing performance TRX::Expected {trx_path} "
                  "but the performance test step produced no result file."
              )
              sys.exit(1)

          try:
              root = ET.parse(trx_path).getroot()
              counters = next(
                  (element for element in root.iter() if local_name(element) == "Counters"),
                  None,
              )
              if counters is None:
                  raise ValueError("TRX does not contain a Counters element")

              counts = {
                  "total": int(counters.get("total", "0")),
                  "executed": int(counters.get("executed", "0")),
                  "passed": int(counters.get("passed", "0")),
                  "failed": int(counters.get("failed", "0")),
                  "skipped": sum(
                      1
                      for element in root.iter()
                      if local_name(element) == "UnitTestResult"
                      and element.get("outcome") == "NotExecuted"
                  ),
              }
              summary["counts"] = counts
          except (ET.ParseError, OSError, TypeError, ValueError) as error:
              summary["status"] = "invalid-trx"
              summary["diagnostic"] = str(error)
              write_evidence()
              print(f"::error title=Invalid performance TRX::{error}")
              sys.exit(1)

          if counts["total"] == 0:
              summary["status"] = "no-matching-tests"
              write_evidence()
              print(
                  "::error title=No matching performance tests::The performance filter "
                  "selected zero tests."
              )
              sys.exit(1)

          if counts["executed"] == 0:
              summary["status"] = "all-tests-skipped"
              write_evidence()
              print(
                  "::error title=All performance tests skipped::The performance filter "
                  f"selected {counts['total']} test(s), but none executed."
              )
              sys.exit(1)

          if summary["testStepOutcome"] != "success":
              summary["status"] = "test-step-failed"
              write_evidence()
              print(
                  "::error title=Performance test step failed::The performance test "
                  f"step outcome was {summary['testStepOutcome']}."
              )
              sys.exit(1)

          if counts["failed"] > 0:
              summary["status"] = "test-failures"
              write_evidence()
              print(
                  "::error title=Performance test failures::The performance TRX "
                  f"reports {counts['failed']} failed test(s)."
              )
              sys.exit(1)

          summary["status"] = "executed"
          write_evidence()
          PY
      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-test-results
          path: TestResults/performance
          if-no-files-found: error
          retention-days: 7
