name: Hexalith CodeQL

# Reusable SAST workflow. Consuming modules call this with a thin caller that sets `languages`.
# Uses build-mode `none` by default so CodeQL analyses source without a full solution build
# (no DAPR/Aspire/submodule orchestration needed for the scan).

on:
  workflow_call:
    inputs:
      languages:
        description: 'Comma-separated CodeQL languages (e.g. csharp).'
        required: false
        type: string
        default: 'csharp'
      build-mode:
        description: 'CodeQL build mode (none | autobuild | manual).'
        required: false
        type: string
        default: 'none'
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
