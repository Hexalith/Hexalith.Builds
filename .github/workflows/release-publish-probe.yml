name: Isolated original release publication probe
on:
  workflow_dispatch:
permissions: {}
cache-mode: none
concurrency:
  group: release-publish-probe
  cancel-in-progress: false
jobs:
  producer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ format('sha256:{0}', steps.upload.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build isolated original package and dual platform image once
        id: build
        run: python3 -I Tools/ci/probe_release_publish.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release
          path: ${{ runner.temp }}/publish-probe-payload/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
  draft:
    needs: producer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      publish: ${{ steps.draft.outputs.publish }}
      version: ${{ steps.draft.outputs.version }}
      sha: ${{ steps.draft.outputs.sha }}
      last-tag: ${{ steps.draft.outputs.last-tag }}
      draft-id: ${{ steps.draft.outputs.draft-id }}
      artifact-id: ${{ steps.draft.outputs.artifact-id }}
      artifact-digest: ${{ steps.draft.outputs.artifact-digest }}
      artifact-run: ${{ steps.draft.outputs.artifact-run }}
    steps:
      - uses: Hexalith/Hexalith.Builds/Github/release-draft@9517bca108b07750e31b1af6df6cfde2bd691bc9
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          sha: ${{ github.sha }}
          version: ${{ needs.producer.outputs.version }}
          notes: Disposable story 3-4 publication qualification. Only the identified isolated package and registry image are authorized.
          artifact-id: ${{ needs.producer.outputs.artifact-id }}
          artifact-digest: ${{ needs.producer.outputs.artifact-digest }}
  publish:
    needs: draft
    if: needs.draft.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: hexalith-release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Poison workspace configuration before the no checkout publisher
        run: python3 -c "from pathlib import Path; Path('NuGet.Config').write_text('poison'); Path('global.json').write_text('poison')"
      - uses: Hexalith/Hexalith.Builds/Github/publish@9517bca108b07750e31b1af6df6cfde2bd691bc9
        with:
          publish: ${{ needs.draft.outputs.publish }}
          version: ${{ needs.draft.outputs.version }}
          sha: ${{ needs.draft.outputs.sha }}
          last-tag: ${{ needs.draft.outputs.last-tag }}
          draft-id: ${{ needs.draft.outputs.draft-id }}
          artifact-id: ${{ needs.draft.outputs.artifact-id }}
          artifact-digest: ${{ needs.draft.outputs.artifact-digest }}
          artifact-run: ${{ needs.draft.outputs.artifact-run }}
          nuget-user: ${{ vars.HEXALITH_NUGET_USER }}
          registry-username: ${{ secrets.HEXALITH_REGISTRY_PUSH_USERNAME }}
          registry-password: ${{ secrets.HEXALITH_REGISTRY_PUSH_PASSWORD }}
