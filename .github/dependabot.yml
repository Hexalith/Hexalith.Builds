# Dependency surveillance for every ecosystem this repository actually ships.
#
# github-actions: scan root workflows only during the AD-20 migration freeze.
# Legacy reusable workflows and all existing Github/* composites must stay
# unchanged until the last managed module has moved to the shared pipeline.
# Restore composite scanning and remove these exclusions after the final deletion.
# nuget: central package versions live in Props/Directory.Packages.props.
# npm: the semantic-release and commitlint toolchain in package.json.
#
# Commit prefixes must stay valid Conventional Commit types, and never `chore`:
# commitlint rejects it and semantic-release derives releases from these types.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    exclude-paths:
      - ".github/workflows/domain-ci.yml"
      - ".github/workflows/domain-ci-v2.yml"
      - ".github/workflows/domain-release.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/commitlint.yml"
      - ".github/workflows/dependency-review.yml"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
